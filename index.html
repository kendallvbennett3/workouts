<script>
(function(){

const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

/* ---------- imported sessions ---------- */
const SESS = RAW.S.map((s,i) => ({
  id:'i'+i, date:s[0], title:s[1], st:s[2], warmup:tx(s[3]), cooldown:tx(s[4]), src:'import',

function cleanTitle(t){
  let c = t.replace(/^week\s*\d+\s*[-–:]\s*/i,'').replace(/^week\s*\d+\s*!?\s*$/i,'').replace(/^potential\s+/i,'').trim();
  return c;
}
function displayTitle(s){
  const c = cleanTitle(s.title);
  if (c) return c;
  const cc = cat('', s.blocks);
  return `${CATN[cc]} · ${DOW[pd(s.date).getDay()]}`;
}
function cat(title, blocks){
  const t = title.toLowerCase();
  if (/recovery|mobility|swat|yoga|happy hips/.test(t)) return 'rec';
  if (/funtensity|testing|pt test/.test(t)) return 'test';
  if (/\brun\b/.test(t)) return 'run';
  if (/full/.test(t)) return 'full';
  if (/lower|legs/.test(t)) return 'lower';
  if (/upper|push|pull|chest|shoulder|arm/.test(t)) return 'upper';
  if ((blocks||[]).some(b => /reflection/i.test(b.n))) return 'test';
  const kl = (blocks||[]).filter(b => b.k).map(b => b.k);
  if (kl.length && kl.every(k => /mobility|flow|walk|mcgill|stretch|yoga|ride|hike|cool down|fold|pancake|airplane|lift off|thoracic|hip core stability/.test(k))) return 'rec';
  if (kl.length && kl.some(k => /interval running|^run\b/.test(k))) return 'run';
  const ks = kl.join(' ');
  if (/mobility|flow|walk/.test(ks) && !/press|squat|deadlift|row/.test(ks)) return 'rec';
  if (/squat|deadlift|hip thrust|lunge/.test(ks) && /press|pull|row/.test(ks)) return 'full';
  if (/squat|deadlift|hip thrust|lunge/.test(ks)) return 'lower';
  if (/press|pull|row/.test(ks)) return 'upper';
  return 'gen';
}
const CATN = {upper:'Upper',lower:'Lower',full:'Full body',rec:'Recovery',run:'Conditioning',test:'Testing',gen:'Mixed'};
const plate = c => `<span class="plate c-${c}" aria-hidden="true"></span>`;

/* cycles: named by hand from what each stretch of programming focused on */
const CYCLES = [

  {id:'c8', name:'Winter Full Body + Run', start:'2025-12-15', end:'2026-02-15', blurb:'Full Body A/B/C with a Saturday interval run, finishing with Funtensity testing week.'},
  {id:'c9', name:'Upper · Lower · Full Bias', start:'2026-02-16', end:'2026-03-22', blurb:'Close-grip bench, cyclist front squat and halting deadlifts across three biased days, with recovery flows and runs.'},
  {id:'c10', name:'Athletic Bodybuilding', start:'2026-03-23', end:'2026-06-14', blurb:'Weighted pull-ups, trap bar deadlifts and hypertrophy work, a SWAT mobility week, and June testing.'},
  {id:'c11', name:'Wedding Ready', start:'2026-06-15', end:'2026-08-09', blurb:'Upper, lower and full-body bias days with hot starts, aimed at the August wedding and the STOP test.'},
  {id:'c12', name:'Aerobic Bodybuilder', start:'2026-08-10', end:'2099-12-31', blurb:'Legs + Core, Chest & Shoulders, Lower and Upper days with bike and Stairmaster conditioning finishers.'}
];
const CYC = new Map(CYCLES.map(c => [c.id, c]));
const cycleOf = d => { for (const c of CYCLES) if (d >= c.start && d <= c.end) return c.id; return d < CYCLES[0].start ? 'c1' : CYCLES[CYCLES.length-1].id; };
const cycDates = c => {
  const ds = SESS.filter(x => cycleOf(x.date) === c.id).map(x => x.date).sort();
  const s = pd(ds[0] || c.start), e = pd(ds[ds.length-1] || c.start);
  if (s.getFullYear() === e.getFullYear() && s.getMonth() === e.getMonth()) return `${MON[s.getMonth()]} ${s.getFullYear()}`;
  return `${MON[s.getMonth()]}${s.getFullYear() !== e.getFullYear() ? ' '+s.getFullYear() : ''} – ${MON[e.getMonth()]} ${e.getFullYear()}`;
};

/* templates: within a cycle, same title on the same weekday = same workout (latest version wins) */
const TPL = new Map();
for (const s of SESS){

  s.cycle = cycleOf(s.date);
  const c = cat(cleanTitle(s.title), s.blocks);
  const dow = pd(s.date).getDay();
  const key = s.cycle + '|' + displayTitle(s).toLowerCase() + (c === 'rec' ? '' : '|' + dow);
  s.tkey = key;
  let t = TPL.get(key);
  if (!t){ t = {key, sessions:[]}; TPL.set(key, t); }
  t.sessions.push(s);
}
for (const t of TPL.values()){
  t.sessions.sort((a,b) => a.date < b.date ? 1 : -1);
  t.latest = t.sessions[0];
  t.title = displayTitle(t.latest);
  t.cat = cat(cleanTitle(t.latest.title), t.latest.blocks);
  t.cycle = t.latest.cycle;
  t.dow = (pd(t.latest.date).getDay() + 6) % 7;
  t.exNames = t.latest.blocks.filter(b => b.k).map(b => b.n);
}
let selCycle = store.get('wl-cycle');
if (!CYC.has(selCycle)) selCycle = CYCLES[CYCLES.length-1].id;

/* ---------- logs (new workouts saved from this page) ---------- */
let LOGS = [];
let dbRef = null, dbState = 'connecting';
function allEntries(){
  const imp = SESS.filter(hasRes);
  const lg = LOGS.map(l => ({...l, src:'log'}));
  return imp.concat(lg).sort((a,b) => a.date === b.date ? ((b.finishedAt||0) - (a.finishedAt||0)) : (a.date < b.date ? 1 : -1));
}
function tplLastDone(t){
  let d = null;
  for (const s of t.sessions) if (hasRes(s)){ d = s.date; break; }
  for (const l of LOGS) if (l.tkey === t.key && (!d || l.date > d)) d = l.date;
  return d;
}
function exHist(k){
  const out = [];
  for (const e of allEntries()) for (const b of e.blocks) if (b.k === k && b.r) out.push({date:e.date, title:displayTitle(e), r:b.r, id:e.id, src:e.src});
  return out;
}
function exName(k){
  for (const e of allEntries()) for (const b of e.blocks) if (b.k === k) return b.n;
  for (const s of SESS) for (const b of s.blocks) if (b.k === k) return b.n;
  return k;
}
function topLoad(r){
  let m = null; const re = /@\s*\+?\s*(\d+(?:\.\d+)?)/g; let x;
  while ((x = re.exec(r))){ const v = parseFloat(x[1]); if (v > 0 && v < 700 && (m === null || v > m)) m = v; }
  return m;
}
function parseSets(r){
  const sets = [];
  for (const raw of String(r).split('\n')){
    const ln = raw.trim();
    let m = ln.match(/^(\d+)\s*x\s*(\d+)\s*@\s*(\+?[\d.]+\s*s?)(?:\s*\/\s*([\d.]+))?/i);
    if (m){ for (let i=0;i<Math.min(+m[1],8);i++) sets.push({reps:m[2], wt:m[3].replace(/\s/g,''), rpe:m[4]||''}); continue; }
    m = ln.match(/^(\d+)\s*@\s*(\+?[\d.]+\s*s?|bw)(?:\s*\/\s*([\d.]+))?(?:\s*x\s*(\d+))?/i);
    if (m){ const n = m[4] ? Math.min(+m[4],8) : 1; for (let i=0;i<n;i++) sets.push({reps:m[1], wt:m[2].replace(/\s/g,''), rpe:m[3]||''}); }
  }
  return sets;
}
function tempos(rx){
  const out = new Set(); const re = /(?:^|[\s;(])([0-4][0-9X][0-4X][0-9X])(?=[;,\s)]|$)/g; let m;
  while ((m = re.exec(rx))) if (/X|[1-4]/.test(m[1])) out.add(m[1]);
  return [...out].slice(0,3);
}

/* ---------- draft workout ---------- */
let draft = store.get('wl-draft');
function newDraftFrom(s, srcTitle){
  return {
    srcId: s.id, tkey: s.tkey || null, title: srcTitle || displayTitle(s), date: todayStr(), startedAt: Date.now(),

  };
}
let saveTimer = null;
function saveDraft(){ clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set('wl-draft', draft), 250); }
function blockResult(b){
  const lines = b.sets.filter(x => x.reps || x.wt || x.rpe).map(x => {
    let s = x.reps ? String(x.reps) : '';
    if (x.wt) s += '@' + x.wt; else if (x.reps && x.rpe) s += '@BW';

  if (b.note.trim()) lines.push(b.note.trim());
  return lines.join('\n');

function renderLib(){

/* ---------- Workout ---------- */
function prevHtml(k, bi){
  const h = exHist(k).slice(0,3);

}
function setRows(b, bi){

}
function exCard(b, bi){
  if (!b.k){

    ${b.rx ? `<div class="rx ${long && !expanded.has(key) ? 'clamp':''}">${esc(b.rx)}</div>${long ? `<button class="linkbtn" data-expand="${key}">${expanded.has(key)?'Show less':'Show full prescription'}</button>`:''}` : ''}
    ${prevHtml(b.k, bi)}

let clockInt = null;
function renderWorkout(){
  clearInterval(clockInt);
  if (!draft){
    $('#view').innerHTML = `<div class="empty"><p><b>No workout in progress.</b></p><p>Pick one from Train to start logging, or repeat any past session from History.</p><button class="btn pri" data-tab-go="train">Choose a workout</button></div>`;

  const logged = draft.blocks.filter(b => b.k && blockResult(b)).length, total = draft.blocks.filter(b => b.k).length;

  h += `<div class="row" style="margin-top:14px"><button class="btn" data-add-ex="1">+ Add exercise</button></div>`;
  h += `<div id="finishArea" style="margin-top:16px"><div class="row"><button class="btn pri grow" data-finish="1">Finish & save workout</button><button class="btn ghost danger" data-discard="1">Discard</button></div></div>`;
  $('#view').innerHTML = h;
  const tick = () => { const el = $('#clock'); if (!el) return; const s = Math.floor((Date.now()-draft.startedAt)/1000); if (s > 6*3600){ el.textContent=''; return; } el.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} elapsed`; };
  tick(); clockInt = setInterval(tick, 1000);
}
function startWorkout(sessionId, force){
  const s = sessionId === 'blank' ? {id:'blank', tkey:null, title:'Custom workout', blocks:[], warmup:'', cooldown:''} : (byId.get(sessionId) || (LOGS.find(l => l.id === sessionId) && {...LOGS.find(l => l.id === sessionId), src:'log'}));
  if (!s) return;
  if (draft && !force){
    openSheet(`<div class="wrap" style="padding-top:24px"><div class="confirm"><b>You already have a workout in progress</b><span class="meta">${esc(draft.title)}. Starting a new one discards what you've entered there.</span>
      <div class="row"><button class="btn pri" data-start-force="${esc(sessionId)}">Discard it and start new</button><button class="btn" data-tab-go="workout">Keep current</button></div></div></div>`);
    return;
  }
  const src = s.src === 'log' ? (byId.get(s.srcId) || s) : s;
  draft = newDraftFrom(src, s.src === 'log' ? s.title : undefined);
  if (s.src === 'log') draft.tkey = s.tkey;
  saveDraft(); setTab('workout'); requestWake();
}
async function finishWorkout(){
  const blocks = draft.blocks.map(b => ({l:b.l, n:b.n, k:b.k, r:blockResult(b)})).filter(b => b.k && b.r);
  if (!blocks.length){ toast('Log at least one set or note before saving.'); return; }
  const id = 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const doc = {date:draft.date, title:draft.title, tkey:draft.tkey, srcId:draft.srcId, startedAt:draft.startedAt, finishedAt:Date.now(), blocks};
  const btn = document.querySelector('[data-finish]'); if (btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    if (dbRef){ await dbRef.collection('logs').doc(id).set(doc); }
    else { const local = store.get('wl-logs') || []; local.push({id, ...doc}); store.set('wl-logs', local); LOGS = local; }
  } catch(e){
    if (btn){ btn.disabled = false; btn.textContent = 'Finish & save workout'; }
    toast(e && e.code === 'quota_exceeded' ? 'Storage is full. Delete some old logged workouts, then save again.' : 'Could not save. Check your connection and tap Finish again.');
    return;
  }
  draft = null; store.del('wl-draft'); stopTimer(); releaseWake();
  toast(`Saved ${blocks.length} exercises to your history.`);
  setTab('history');
}

/* ---------- History ---------- */

      ${b.r ? `<div class="res">${esc(b.r)}</div>` : `<span class="meta">Not logged</span>`}

/* ---------- Exercises ---------- */
function exIndex(){
  const m = new Map();
  for (const e of allEntries()) for (const b of e.blocks){
    if (!b.k || !b.r) continue;
    let x = m.get(b.k);
    if (!x){ x = {k:b.k, n:b.n, count:0, last:e.date, lastR:b.r}; m.set(b.k, x); }
    x.count++;
  }
  return [...m.values()];
}
function renderExercises(){
  let h = `<h2 class="h-sec">Exercises</h2><p class="sub">Every exercise with logged results. Tap one for its full history and load trend.</p>
    <input class="search" id="exq" type="search" placeholder="Search, e.g. bench, pull up, hip thrust" value="${esc(exQuery)}" autocomplete="off"><div id="exlist" style="margin-top:12px"></div>`;
  $('#view').innerHTML = h; renderExList();
}
function renderExList(){
  const q = exQuery.trim().toLowerCase();
  const xs = exIndex().filter(x => !q || x.n.toLowerCase().includes(q)).sort((a,b) => a.last < b.last ? 1 : a.last > b.last ? -1 : b.count - a.count);
  const el = $('#exlist'); if (!el) return;
  el.innerHTML = xs.length ? `<div class="list">${xs.map(x => { const tl = topLoad(x.lastR);
    return `<button class="li" data-exk="${esc(x.k)}"><span class="grow" style="min-width:0"><span class="t">${esc(x.n)}</span><br><span class="s">${x.count}× · last ${fmtShort(x.last)} ${pd(x.last).getFullYear()}${tl!==null && !/assist/i.test(x.n) ? ' · top '+tl+' lb':''}</span></span><span class="chev">›</span></button>`; }).join('')}</div>` : `<p class="empty">No exercises match “${esc(exQuery)}”.</p>`;
}
function chartSvg(pts){
  const W = 600, H = 200, L = 40, R = 14, Tp = 14, B = 26;
  const t0 = pd(pts[0].date).getTime(), t1 = pd(pts[pts.length-1].date).getTime();
  const vs = pts.map(p => p.v); let lo = Math.min(...vs), hi = Math.max(...vs);
  if (lo === hi){ lo -= 5; hi += 5; }
  const pad = (hi-lo)*0.12; lo = Math.max(0, lo-pad); hi = hi+pad;
  const step = niceStep((hi-lo)/4); const g0 = Math.ceil(lo/step)*step;
  const X = t => L + (t1===t0 ? (W-L-R)/2 : (t-t0)/(t1-t0)*(W-L-R));
  const Y = v => Tp + (1-(v-lo)/(hi-lo))*(H-Tp-B);
  let grid = '';
  for (let v = g0; v <= hi; v += step) grid += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${+v.toFixed(1)}</text>`;
  const xl = `<text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)">${fmtShort(pts[0].date)} ${pd(pts[0].date).getFullYear()}</text><text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtShort(pts[pts.length-1].date)} ${pd(pts[pts.length-1].date).getFullYear()}</text>`;
  const coords = pts.map(p => [X(pd(p.date).getTime()), Y(p.v)]);
  const line = coords.map((c,i) => (i?'L':'M')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area = line + ` L${coords[coords.length-1][0].toFixed(1)} ${H-B} L${coords[0][0].toFixed(1)} ${H-B} Z`;
  const dots = coords.map((c,i) => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${i===coords.length-1?5:3.5}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Top load over time" id="chartsvg">${grid}<path d="${area}" fill="var(--accent)" fill-opacity=".10"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>${dots}<circle id="hl" r="7" fill="none" stroke="var(--ink)" stroke-width="2" cx="-20" cy="-20"/>${xl}</svg>`;
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x||1))); const f = x/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function openExercise(k){
  const hist = exHist(k), name = exName(k);
  const assisted = /assist/i.test(name);
  const pts = hist.map(h => ({date:h.date, v:topLoad(h.r), title:h.title})).filter(p => p.v !== null).reverse();
  const best = pts.length ? Math.max(...pts.map(p => p.v)) : null;
  let h = `<header class="top"><div class="top-in"><button class="back" data-close="1">‹ Back</button></div></header><div class="wrap">
    <div class="wo-head"><span class="eyebrow">Exercise</span><h1>${esc(name)}</h1></div>
    <div class="stats" style="margin-top:14px"><div class="stat"><b class="mono">${hist.length}</b><span>times logged</span></div>
    <div class="stat"><b>${hist.length ? fmtShort(hist[0].date) : '—'}</b><span>last done</span></div>
    <div class="stat"><b class="mono">${best!==null && !assisted ? best : '—'}</b><span>${assisted ? 'assist: lower is harder' : 'heaviest logged (lb)'}</span></div></div>`;
  if (pts.length >= 2 && !assisted){
    h += `<div class="chart" style="margin-top:12px"><div class="eyebrow">Top load per session (lb)</div><div class="cap" id="cap">Tap the chart to read a point.</div>${chartSvg(pts)}</div>`;
  }
  h += `<div class="month">All results</div>`;
  h += hist.length ? `<div class="list">${hist.map(x => `<button class="li" data-entry="${esc(x.id)}" style="align-items:flex-start"><span class="date"><b>${pd(x.date).getDate()}</b><span>${MON[pd(x.date).getMonth()]} ${String(pd(x.date).getFullYear()).slice(2)}</span></span><span class="grow" style="min-width:0"><span class="s">${esc(x.title)}${x.src==='log'?'<span class="new">New</span>':''}</span><div class="res" style="margin-top:3px">${esc(x.r)}</div></span></button>`).join('')}</div>` : `<p class="empty">No results logged yet.</p>`;
  h += `</div>`;
  openSheet(h);
  const svg = $('#chartsvg');
  if (svg){
    const W = 600, L = 40, R = 14;
    const t0 = pd(pts[0].date).getTime(), t1 = pd(pts[pts.length-1].date).getTime();
    const xs = pts.map(p => L + (t1===t0?0:(pd(p.date).getTime()-t0)/(t1-t0))*(W-L-R));
    const pick = ev => {
      const r = svg.getBoundingClientRect(); const x = (ev.clientX - r.left) / r.width * W;
      let bi = 0; xs.forEach((v,i) => { if (Math.abs(v-x) < Math.abs(xs[bi]-x)) bi = i; });
      const c = svg.querySelectorAll('circle')[bi]; const hl = $('#hl');
      hl.setAttribute('cx', c.getAttribute('cx')); hl.setAttribute('cy', c.getAttribute('cy'));
      $('#cap').innerHTML = `<b class="mono">${pts[bi].v} lb</b> · ${fmtD(pts[bi].date)} · ${esc(pts[bi].title)}`;
    };
    svg.addEventListener('pointermove', pick); svg.addEventListener('pointerdown', pick);
  }
}
function openPicker(){
  let h = `<header class="top"><div class="top-in"><button class="back" data-close="1">‹ Back</button><span class="grow" style="font-weight:700">Add exercise</span></div></header><div class="wrap" style="padding-top:12px">
    <input class="search" id="pickq" type="search" placeholder="Search exercises" autocomplete="off"><div class="row" style="margin-top:10px"><button class="btn sm" id="pickcustom">Add “<span id="pickname">custom</span>” as new</button></div><div id="picklist" style="margin-top:12px"></div></div>`;
  openSheet(h);
  const draw = () => {
    const q = ($('#pickq').value||'').trim().toLowerCase();
    $('#pickname').textContent = q ? $('#pickq').value.trim() : 'custom';
    const xs = exIndex().filter(x => !q || x.n.toLowerCase().includes(q)).sort((a,b) => b.count - a.count).slice(0,80);
    $('#picklist').innerHTML = `<div class="list">${xs.map(x => `<button class="li" data-pick="${esc(x.k)}"><span class="grow"><span class="t">${esc(x.n)}</span><br><span class="s">${x.count}× logged</span></span><span class="chev">+</span></button>`).join('')}</div>`;
  };
  $('#pickq').addEventListener('input', draw); draw();
  $('#pickcustom').addEventListener('click', () => {
    const n = ($('#pickq').value||'').trim(); if (!n){ $('#pickq').focus(); return; }
    addBlock(n, n.toLowerCase().replace(/[^a-z0-9/ ()&-]/g,' ').replace(/\s+/g,' ').trim());
  });
}
function addBlock(n, k){
  const nextL = '+' + (draft.blocks.filter(b => b.l.startsWith('+')).length + 1);
  draft.blocks.push({l:nextL, n, k, rx:'', sets:[], note:''});
  saveDraft(); closeSheet(); render();
  const el = document.getElementById('ex-'+(draft.blocks.length-1)); if (el) el.scrollIntoView({block:'center'});
}

/* ---------- sheet ---------- */
function openSheet(html){ $('#sheet').innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; document.body.style.overflow = 'hidden'; const s = $('.sheet'); if (s) s.scrollTop = 0; }
function closeSheet(){ $('#sheet').innerHTML = ''; document.body.style.overflow = ''; }

/* ---------- rest timer ---------- */
let tEnd = 0, tInt = null, tShown = false, actx = null;
function renderTimer(){
  const box = $('#tbox'), wrap = $('#timer');
  const showOnWorkout = tab === 'workout' && draft;
  wrap.hidden = !(tEnd || (showOnWorkout && tShown) || showOnWorkout);
  if (wrap.hidden) return;
  if (!tEnd){
    box.className = 'tbox';
    box.innerHTML = tShown ? `<span style="font-size:12px;padding:0 4px">Rest</span>${[60,90,120,180].map(s => `<button class="btn sm" data-rest="${s}">${s<120?s+'s':s/60+'m'}</button>`).join('')}<button class="btn sm" data-tshow="0" aria-label="Close">×</button>`
      : `<button class="btn sm" data-tshow="1">⏱ Rest timer</button>`;
    return;
  }
  const left = Math.max(0, Math.round((tEnd - Date.now())/1000));
  box.className = 'tbox' + (left === 0 ? ' done' : '');
  box.innerHTML = `<span class="big">${left === 0 ? 'GO' : Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}</span><button class="btn sm" data-rest-add="15">+15s</button><button class="btn sm" data-rest-stop="1">${left===0?'Done':'Stop'}</button>`;
}
function startTimer(s){
  tEnd = Date.now() + s*1000; clearInterval(tInt);
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  let fired = false;
  tInt = setInterval(() => { if (!fired && Date.now() >= tEnd){ fired = true; beep(); } renderTimer(); }, 250);
  renderTimer();
}
function stopTimer(){ tEnd = 0; clearInterval(tInt); tShown = false; renderTimer(); }
function beep(){
  try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e){}
  try { if (!actx) return; [0,0.25,0.5].forEach(t => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(0.0001, actx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+t+0.18); o.connect(g).connect(actx.destination); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+0.2); }); } catch(e){}
}
let wake = null;
async function requestWake(){ try { if ('wakeLock' in navigator && !wake) wake = await navigator.wakeLock.request('screen'); } catch(e){ wake = null; } }
function releaseWake(){ try { wake && wake.release(); } catch(e){} wake = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && draft && tab === 'workout'){ wake = null; requestWake(); } });

/* ---------- render ---------- */
function render(){
  renderTop(); renderTabs();
  if (tab === 'train') renderTrain();
  else if (tab === 'workout') renderWorkout();
  else if (tab === 'history') renderHistory();
  else renderExercises();
  renderTimer();
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button, [data-tab]'); if (!t) return;
  const d = t.dataset;
  if (d.cycle){ selCycle = d.cycle; store.set('wl-cycle', selCycle); libQuery = ''; return renderTrain(); }
  if (d.tab) return setTab(d.tab);
  if (d.tabGo) return setTab(d.tabGo);
  if (d.start) return startWorkout(d.start);
  if (d.startForce){ draft = null; return startWorkout(d.startForce, true); }
  if (d.blank) return startWorkout('blank');
  if (d.close) return closeSheet();
  if (d.entry) return openEntry(d.entry);
  if (d.askDel) return openEntry(d.askDel, true);
  if (d.delLog) return deleteLog(d.delLog);
  if (d.exk && !d.pick) return openExercise(d.exk);
  if (d.pick){ const x = exIndex().find(x => x.k === d.pick); return addBlock(x ? x.n : d.pick, d.pick); }
  if (d.expand){ expanded.has(d.expand) ? expanded.delete(d.expand) : expanded.add(d.expand); return renderWorkout(); }
  if (d.addSet){ const b = draft.blocks[+d.addSet]; const last = b.sets[b.sets.length-1]; b.sets.push(last ? {...last} : {reps:'', wt:'', rpe:''}); saveDraft(); renderWorkout(); const i = document.getElementById(`r-${d.addSet}-${b.sets.length-1}`); if (i && !last) i.focus(); return; }
  if (d.delSet){ const [bi,si] = d.delSet.split(':').map(Number); draft.blocks[bi].sets.splice(si,1); saveDraft(); return renderWorkout(); }
  if (d.copy !== undefined){ const b = draft.blocks[+d.copy]; const h = b && exHist(b.k)[0]; if (h){ b.sets = parseSets(h.r); saveDraft(); renderWorkout(); toast('Copied last sets. Adjust what changed.'); } return; }
  if (d.addEx) return openPicker();
  if (d.finish) return finishWorkout();
  if (d.discard){ $('#finishArea').innerHTML = `<div class="confirm"><b>Discard this workout?</b><span class="meta">Everything you entered for ${esc(draft.title)} is removed.</span><div class="row"><button class="btn danger" data-discard-yes="1">Discard workout</button><button class="btn" data-discard-no="1">Keep logging</button></div></div>`; return; }
  if (d.discardYes){ draft = null; store.del('wl-draft'); stopTimer(); releaseWake(); return setTab('train'); }
  if (d.discardNo) return renderWorkout();
  if (d.tshow){ tShown = d.tshow === '1'; return renderTimer(); }
  if (d.rest) return startTimer(+d.rest);
  if (d.restAdd){ tEnd = Math.max(tEnd, Date.now()) + (+d.restAdd)*1000; return renderTimer(); }
  if (d.restStop) return stopTimer();
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'libq'){ libQuery = el.value; return renderLib(); }
  if (el.id === 'exq'){ exQuery = el.value; return renderExList(); }
  if (!draft) return;
  if (el.dataset.f){ draft.blocks[+el.dataset.b].sets[+el.dataset.s][el.dataset.f] = el.value.trim(); saveDraft(); return; }
  if (el.dataset.note !== undefined){ draft.blocks[+el.dataset.note].note = el.value; el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; saveDraft(); return; }
  if (el.id === 'wodate' && el.value){ draft.date = el.value; saveDraft(); }
});
async function deleteLog(id){
  try {
    if (dbRef) await dbRef.collection('logs').doc(id).delete();
    else { LOGS = LOGS.filter(l => l.id !== id); store.set('wl-logs', LOGS); }
  } catch(e){ toast('Could not delete. Try again in a moment.'); return; }
  closeSheet(); toast('Workout deleted.'); render();
}

/* ---------- boot ---------- */
render();
(async () => {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch(e){ db = null; }
  if (!db){ dbState = 'local'; LOGS = store.get('wl-logs') || []; render(); return; }
  dbRef = db;
  db.collection('logs').onSnapshot(snap => {
    LOGS = snap.docs.filter(d => d.exists).map(d => ({id:d.id, ...d.data()}));
    dbState = 'on';
    const active = document.activeElement;
    const typing = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
    if (tab === 'workout' && typing) renderTop(); else if (!$('#sheet').innerHTML) render(); else renderTop();
  }, () => { dbState = 'local'; dbRef = null; LOGS = store.get('wl-logs') || []; render(); });
})();
})();
</script>
