<style>
/* Layout: phone-first app shell; sticky top bar, scrolling view, fixed bottom tabs. Plate colors (red/blue/yellow/green) tag workout type. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#121823; --muted:#5A6476; --faint:#8790A0; --line:#D9DEE6;
  --accent:#1E4FD0; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB;
  --p-red:#D23A2E; --p-blue:#2457D4; --p-yellow:#D99A0B; --p-green:#2A9455; --p-gray:#8A93A3;
  --good:#1F8A4C; --warn:#B26A00; --bad:#C2352B;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1117; --surface:#161B24; --surface2:#1C2230; --ink:#E7EBF1; --muted:#9AA4B5; --faint:#6F7889; --line:#283040;
  --accent:#7398FF; --accent-ink:#0B1020; --accent-soft:#1D2742;
  --p-red:#F06A5E; --p-blue:#6E94FF; --p-yellow:#F2BC45; --p-green:#4CC27E; --p-gray:#8D97A8;
  --good:#4CC27E; --warn:#F2BC45; --bad:#F06A5E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1117; --surface:#161B24; --surface2:#1C2230; --ink:#E7EBF1; --muted:#9AA4B5; --faint:#6F7889; --line:#283040;
  --accent:#7398FF; --accent-ink:#0B1020; --accent-soft:#1D2742;
  --p-red:#F06A5E; --p-blue:#6E94FF; --p-yellow:#F2BC45; --p-green:#4CC27E; --p-gray:#8D97A8;
  --good:#4CC27E; --warn:#F2BC45; --bad:#F06A5E; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--muted);margin-top:3px}
.grow{flex:1;min-width:0}
h1,h2,h3{text-wrap:balance;margin:0}
.h-sec{font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:22px 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;background:var(--surface2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:42px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.plate{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--surface) 0%,transparent),0 0 0 2px var(--surface);position:relative}
.plate::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.c-upper{background:var(--p-blue)} .c-lower{background:var(--p-red)} .c-full{background:var(--p-yellow)} .c-rec{background:var(--p-green)} .c-run,.c-test,.c-gen{background:var(--p-gray)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grid{display:grid;gap:10px}
.tpl{display:flex;flex-direction:column;gap:8px}
.tpl h3{font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;line-height:1.05}
.tpl .ex-names{color:var(--muted);font-size:13px;margin:0}
.tpl .foot{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.meta{font-size:12px;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:var(--r);padding:12px 14px;margin-top:14px}
.banner b{display:block}
/* list rows */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.li:first-child{border-top:0}
.li .t{font-weight:600}
.li .s{font-size:12px;color:var(--muted)}
.li .chev{color:var(--faint);font-size:18px}
.li .date{width:44px;flex:none;text-align:center;line-height:1}
.li .date b{display:block;font-family:var(--f-display);font-size:24px}
.li .date span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.new{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:1px 6px;margin-left:6px;vertical-align:2px}
details.build{margin-top:10px}
details.build>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 2px;font-weight:600}
details.build>summary::-webkit-details-marker{display:none}
details.build>summary::before{content:"+";font-family:var(--f-mono);color:var(--muted);width:14px}
details.build[open]>summary::before{content:"–"}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:16px}
.month{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 2px 6px}
/* workout */
.wo-head{padding-top:14px;display:flex;flex-direction:column;gap:8px}
.wo-head h1{font-family:var(--f-display);font-size:32px;font-weight:700;text-transform:uppercase;line-height:1}
.clock{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex-h{display:flex;gap:10px;align-items:flex-start}
.lbl{font-family:var(--f-display);font-weight:700;font-size:15px;min-width:30px;height:26px;padding:0 6px;border-radius:7px;background:var(--ink);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ex-h h3{font-size:17px;font-weight:700;line-height:1.25;padding-top:2px}
.tempo{display:inline-flex;gap:4px;align-items:center;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.rx{white-space:pre-line;font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.rx.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13px}
.prev{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.prev-i{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.prev-i .d{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;padding-top:2px}
.res{font-family:var(--f-mono);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:22px 1fr 14px 1.2fr 34px 0.9fr 34px;gap:6px;align-items:center}
.set .n{font-family:var(--f-mono);font-size:12px;color:var(--faint);text-align:right}
.set input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:9px 6px;text-align:center;font-family:var(--f-mono);font-size:16px}
.set .u{font-size:11px;color:var(--faint);text-align:center}
.x{border:0;background:transparent;color:var(--faint);font-size:20px;line-height:1;padding:6px}
.sethead{display:grid;grid-template-columns:22px 1fr 14px 1.2fr 34px 0.9fr 34px;gap:6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:center}
textarea.note{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:9px 10px;font-size:15px;min-height:42px;resize:vertical}
.coach{font-size:13px}
.coach summary{cursor:pointer;font-weight:600;color:var(--muted)}
.coach .rx{margin-top:8px}
.extra{border:1px dashed var(--line);border-radius:var(--r);padding:12px}
.extra summary{cursor:pointer;font-weight:600}
.extra .rx{margin-top:8px}
/* sheets */
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet .top{top:0}
.back{border:0;background:none;font-weight:600;color:var(--accent);padding:8px 0;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.05}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 6px}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .cap{font-size:12px;color:var(--muted);min-height:18px}
.confirm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
/* tabs + timer */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--p-red);margin-top:-2px}
.timer{position:fixed;left:0;right:0;z-index:31;bottom:calc(62px + env(safe-area-inset-bottom,0px));pointer-events:none}
.timer-in{max-width:640px;margin:0 auto;padding:0 12px 8px;display:flex;justify-content:flex-end}
.tbox{pointer-events:auto;background:var(--ink);color:var(--surface);border-radius:14px;padding:8px;display:flex;gap:6px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.22);flex-wrap:wrap;justify-content:flex-end}
.tbox .btn{background:transparent;color:var(--surface);border-color:color-mix(in srgb,var(--surface) 25%,transparent);min-height:36px;padding:6px 10px}
.tbox .big{font-family:var(--f-mono);font-size:22px;font-weight:600;padding:0 8px;min-width:76px;text-align:center}
.tbox.done{background:var(--p-red)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;font-size:14px;z-index:80;max-width:calc(100% - 32px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -16px;padding-inline:16px;scroll-snap-type:x proximity;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:1px;max-width:200px}
.chip b{font-family:var(--f-display);font-size:18px;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip span{font-size:11px;color:var(--muted);white-space:nowrap}
.chip[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip[aria-selected="true"] span{color:color-mix(in srgb,var(--surface) 70%,transparent)}
.blurb{margin:0 0 14px;max-width:62ch}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--good)}
@media (prefers-reduced-motion:no-preference){.tbox.done{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.04)}}}
@media (min-width:560px){.grid.two{grid-template-columns:1fr 1fr}}
</style>
</head>

<script id="seed" type="application/json">{"T":["WELCOME back to TrueCoach!\nWe are starting with a \"week 0\" with the goal of filming a ton and learning the nuance of each new movement.\n\nThe goal of this build is to shift away from our primary lifts that we had been building for the last two years towards the STOP test. We are still training similar compound movement patterns, but changing up the modaity and Rx slightly so that you can keep your brain fresh and excited.\n\nWith that, there are a handful of NEW movements and machines - please look through each workout to ensure you have each piece of equipment at your gym and send me a message if you need any changes! \n\nThe RPE this week is about 6-7/10 with the goal of fully recovering from last week (mentally and physically). You will see the RPE ratings in your training are different - this is because we are going to repeat week 0 to week 1 and 2 etc and those RPEs are for week 1+2 :) If you are feeling fresh and ready to hit it hard - by all means, GO for it! I want you leaving each session satisfied, but not tapped.\n\nCoach Bri.","10-15 reps RPE 8\n-rest 90 sec-\n15-20 reps RPE 9\n-rest 90 sec-\n15-20 reps RPE 10","6-10 reps @RPE 9\n-rest 90 sec-\n10-15 reps @RPE 10","15-20 reps @RPE 10 x2 sets; rest 60 sec","10reps each @ RPE 10 x 2sets; rest 60 sec","Accumulate 50 reps for quality; break up reps as needed","5min Cardio Your Choice \n+\n2 sets\n1) 10 Quadruped Thoracic Rotations/side\n2) 6-8 Half Kneeling DB Windmill Press/side @ 2020\n3) 10 Reverse Plank Bridge Hip Lift/side\n4) 10 Prone Snow Angels. - controlled","Cooldown\n\n1. Barbell Shoulder Extension Stretch x 30 sec\n2. Single Arm Wall Prayer Stretch x 30 sec/side\n3. Supinated Passive Hang x 30 sec","6-10 reps/leg @RPE 9\n-rest 90 sec-\n10-15 reps/leg @RPE 10\n\n*Use a stack of 3x45lb plates - more glute and hamstring biased","6-10 reps @RPE 9\n-rest 90 sec-\n10-15 reps @RPE 10\n\n*Box is >2\" below kneecap","6-10 reps/leg @RPE 9\n-rest 90 sec-\n10-15 reps/leg @RPE 10","20-24 steps @RPE 10 x2 sets","20-24 alt reps @RPE 10 x2 sets","15-20 reps @RPE 10 x4 sets","3-5 min Cardio of Choice\n+\n2-3 Sets\n1) 12 Death March (6/leg)\n2) 10 Suitcase Patrick Step Down/side\n3) 20 Hollow Rocks\n4) 10 Squat Plus Thoracic Rotation/side (use leverage with the non-working hand to reach up)","1 set:\nElevated Pigeon x 60 sec/side\nCouch Stretch x 60 sec/side\nFrog Stretch x 60sec\n5min Static back*\n\n*Perform 5 minutes of static back. Try to inhale through the nose for 3 seconds and exhale through the mouth for 6 seconds. Try to slow the breathing post workout in order to switch from a sympathetic to a parasympathetic state before resuming your day to day. This will help with better nutrient absorption, energy regulation and overall mindset.","6-10 reps @RPE 9\n-rest 90 sec-\n10-15 reps @RPE 10\n\n*OR a chest-supported row that is neutral grip like a T-Bar Row","6-10 reps @RPE 9\n-rest 90 sec-\n10-15 reps @RPE 10\n   \nW/ black band \n10@95 \n15@115\nThat was harder than I thought it would be!","6-10 reps/arm @RPE 9\n-rest 90 sec-\n10-15 reps/arm @RPE 10","12-20 reps RPE 10 x2 sets; rest 60 sec","15-20 reps RPE 10 x2 sets; rest 60 sec","5min Cardio Your Choice \n+\n2 sets\n1) 10 Runner Lunge Thoracic Rotations/side\n2) 10 DB External Rotations/arm\n3) 10 Reverse Plank Bridge Hip Lift/side\n4) 20 Prone Scapular Retractions","Cooldown:\n1) Banded Lat Stretch x 30 sec/side\n2) Banded Cross Body Shoulder Stretch x 30 sec/side\n3) Banded Shoulder Extension Stretch x 30-60 sec\n4) Banded Rhomboid/Protraction Stretch x 30-60 sec\n5) Static Back 5min*","6-10 reps @RPE 9\n-rest 90 sec-\n10-15 reps @RPE 10\n\n*Film all sets directly from the side","15-20 reps @RPE 10 x2 sets","Please submit your weekly check-in!\nhttps://docs.google.com/forms/d/e/1FAIpQLSce4Hh5kX85R5wTyVXyUusJR-yuOl8trnTThBYZf4Mv43A7TQ/viewform?usp=header","Welcome to your first official week of this build!\n\n*RPE goal this week: 8-10/10 RPE (see Rx in each movement)\n*Leave about 1-2 reps in the tank (RIR = reps in reserve) before ABSOLUTE failure, and about 0-1 reps in the tank before form and/or tempo adherence or loss of mind-muscle connection.\n*We are keeping the same reps this week so you can prioritize your INTENT in each session versus only focusing on increasing load.\n\nIf you start too light in your first set to elicit the Rx'd RPE, either:\n1. stop the set and grab the heavier weight, or\n2. Continue the set and consider it your last warm up set\n3. OR, Perform as many reps as you need with that weight to hit the ideal RPE target and use that knowledge for next week,\n\nPlease continue filming your first and last sets so you can form-review your own movement in the first set! Then, send those videos via messages so I can form review for you before you hit that lift again! \n\nCoach Bri","*Record your results here each time!\n\n*ALSO record if you consciously focused on down-regulating your brain and re-infusing that MANTRA of \u201cI will stay on the stop team because I worked it\u201d \n\nRun Intervals:\n30sec Run @ 85% \n30sec Sandbag Get Ups\n1min Rest/Walk\nx as many rounds until \"satisfied\"\n*If you plan to perform more than 8 sets, rest an extra 2-3min half way.","Dynamic Run Warm Up (8min)\n\n1-2 Sets:\n10m Piriformis Walks\n10m Walking Quad Stretch with Reach\n10m Hip Opener Walk\n10m Low Cossack Walks\n10 Runner Lunge Thoracic Rotation/side\n10 Scorpions w/ chest opener/side\n10-20 Dynamic Frog Stretch\n10-20 Shinbox Switch\n*Perform 2 sets if you are particularly tight today!\n\n+\nSprint Accelerations\nSet 1 - Start at 50% and end at 70%\nSet 2 - Start at 65% and end at 85%\nSet 3 - Start at 70-80% and end at your safest sprint effort for today\n+\nWalk 2mins after last sprint effort and go right into your intervals or jog for the day.","Cooldown \n\n1-2 sets \n1. Butterfly Stretch x 60 sec\n2. Shoulder Extension Bridge x 5 with 5-sec hold in the stretch position. \n3. Prayer Stretch x 30 sec \n4. Static Back*\n\n*Perform 5 minutes of static back. Try to inhale through the nose for 3 seconds and exhale through the mouth for 6 seconds. Try to slow the breathing post workout in order to switch from a sympathetic to a parasympathetic state before resuming your day to day. This will help with better nutrient absorption, energy regulation and overall mindset.","6-10 reps @RPE 9\n-rest 90 sec-\n10-15 reps @RPE 10\n\n*Film all sets directly from the side\n*Back rack cyclist instead if needed","2-4 Sets:\n30sec Side Plank Clamshell LEFT\n10 Half Kneeling Hip Flexor Raise LEFT\n30sec Pike Leg Lift Over LEFT\n30sec Side Plank Clamshell LEFT\n10 Half Kneeling Hip Flexor Raise RIGHT\n30sec Pike Leg Lift Over RIGHT\n\n*rest as needed between sets and movements to keep mind-muscle connection top notch","Welcome to week 2 where, you guessed it, we are repeating these same reps again. This week, take the movement cue feedback I gave you, and action those movement cues WHILE maintaining the same or more load as last week. If you start your set of 6-10 and realize you loaded too heavy/light, stop the set and make the adjustment in load and start again. If you get to 10reps and realize it was too light, go for more reps. If you loaded too heavy, and only got like 4 reps, rest a brief moment and complete the last two.\n\nPlease film the movement I gave you movement cues for this week to ensure we made those changes. You can upload the videos in the section of that movement - ie: put your lateral raise video in that section vs as a comment.\n\nLET'S GET ITTT\nBri","3-5 reps @RPE 9\n-rest 90 sec-\n10-15 reps @RPE 10","6-10 reps @RPE 9\n-rest 90 sec-\n10-15 reps @RPE 10\n   \nThis was dicey.  Started too heavy and then still thought I could do it\u2026. Fail. \n6@135/9\n4@140/10+\n6@115\n\nGoing back and looking at the video I feel like it looks like I had more in the tank but did not feel like it in the moment","15-20reps/leg @RPE 10 x2 sets","6-10 reps/arm @RPE 9\n-rest 90 sec-\n10-15 reps/arm @RPE 10\n\n*changing this up so we can ensure you are getting the most lat engagement we can and emphasizing pulling that scap down and back into the shoulder gurdle","Welcome to week 3!\nThis week, we are going to perform this rep scheme ONE more week before we change the reps next week. Next week, you will see an ascending rep scheme (5,10,15reps) where your goal will be to find that 9-10 RPE for all 3 sets. Start considering what that load would be for 5 reps as you complete the last week of 6-10 and 10-15 this week!","Welcome to week 4!\nThis week, you will see an ascending rep scheme (5,10,15reps) where your goal will be to find that 9-10 RPE for all 3 sets. \nI want you to take at least 2-3 warm up sets of 5-7 reps to find that starting weight. Then, you will strip about 5-10% off from your bar with the subsequent drop sets, with the goal of maintaining that 9-10 RPE.\n\nIf you start your set of 5 and realize you loaded way too heavy/light, stop the set and make the adjustment in load and start again. If you get to 5reps and realize it was too light, go for more reps. If you loaded too heavy, and only got like 4 reps, rest a brief moment and complete the last rep.","6-10 reps RPE 8\n-rest 90 sec-\n10-15 reps RPE 9\n-rest 90 sec-\n15-20 reps RPE 10","1.1.1 reps; rest 90sec-2min between sets x 5 sets","5,10,15reps; rest 90sec-2min between sets","10.10.10 reps @RPE 10 x2 sets; rest 60 sec\n*rest 10sec between sets of 10 for 30reps per set","Tabata\n20sec Max Reps\n10sec Rest\nx 8 sets","5,10,15reps/leg; rest 60sec between legs; rest 90sec-2min between sets\n\n*Use a stack of 3x45lb plates - more glute and hamstring biased","5,10,15reps/leg; rest 30sec between sides; rest 90sec-2min between sets","20-24 alt reps @RPE 10 x2 sets\n\n*step down from a bench, alt legs, control from the glutes and do NOT use your toe to bound up. If you feel you need to, opt for a shorter bench or stack of plates\n*film your last few reps rom front","10.10.10 reps @RPE 10 ng each working set to it's full potential without being fatigued from the previous set.\n\nCoach Bri","31X1; 8-12reps/arm; rest 60sec x 3","Accumulate 40-60sec of work; rest 2min x 3","20X1; 12-15reps; rest as needed x 3 sets","10X3; 8-12reps; rest as needed x 3 sets","**3131; 5reps; rest as needed x 2-3 sets\n\n*Only do as much volume as you can keep your core braced - think of your first part of the session EARNING this segment of your training. Keep it SUPER light and only focus on ROM and quality of bracing and positions.\n\n**Now, give yourself TWO positive affirmations before loading the barbell","2-3 sets:\n10 Facing Away Cable Curls\n- directly into - \n10 Squatting Cable Curls (stay ACTIVE in squatting position here!!)\n- directly into -\n10 Standing Cable Curls\n*Still use the two handles, just step in between the cable arms\nrest as needed between sets\n\n*Aim for 7 RPE in set 1 and RPE 7-9-10 in second set and 3rd set if you choose to do it.\n*Reps will go UP in this progression","5min Cardio Your Choice\n+\n2 sets\n1) 10 Runner Lunge Thoracic Rotation/side\n2) 10 Squat Hip Rotations/side\n3) 10 Pirformis Walks/side\n4) Deadbug x 40sec","Cooldown\n1 set:\n1) Banded Behind the Back Stretch x 30 sec/side\n2) Band Pass Through x 10/side\n3) Supinated Passive Hang x 60 sec\n4) 5min Static back*\n\n*Perform 5 minutes of static back. Try to inhale through the nose for 3 seconds and exhale through the mouth for 6 seconds. Try to slow the breathing post workout in order to switch from a sympathetic to a parasympathetic state before resuming your day to day. This will help with better nutrient absorption, energy regulation and overall mindset.","Nerve Gliding Series\nPiriformis Walks x 10/leg or Stretch x 1min \nLying spinal twist x10/side\nFoam rolling \nPiriformis release with a lacrosse ball (seems to help the most)\nCat Cow x 20reps\nQuadruped Hip CARs x 5/side/direction\nWorlds Greatest Stretch x 1 min/side\nFront Split Progression x 1 min/side\nBottom of Squat Hold x 1 min \nAssisted Cossack Squat x 10/side\n\n*Perform this ONCE. If you have a little extra time/oomph, repeat 1-2 of the movements that feel the tightest for you today.","perform this AT NIGHT or after your session. You can do the first part before if you would like with your warm up.","DO THIS BEFORE LEAVING THE HOUSE FOR THE TEST","Go through each movement test and reflect how it went for you today.\n\nDO NOT leave the site until you have done your cool down AND given yourself at least 2 compliments for how you handled the test.","1 set:\nT-Spine Can Opener x 60sec\nChilds Pose Lat Stretch x 30sec/side\nElevated Pigeon x 60 sec/side\nCouch Stretch x 60 sec/side\nFrog Stretch x 60sec\n5min Static back*\n\n*Perform 5 minutes of static back. Try to inhale through the nose for 3 seconds and exhale through the mouth for 6 seconds. Try to slow the breathing post workout in order to switch from a sympathetic to a parasympathetic state before resuming your day to day. This will help with better nutrient absorption, energy regulation and overall mindset.","30mins Continuous @ Conversational Pace\n2min Walk/Jog\n5 Curtsy Box Step Down/leg @ 3131 tempo\n20 Bench Dips @ 21X0\n- rest 30-60sec -\n5min Spin Bike\n5-10 Supinated Strict Pull Up @ 30X0\n10 Bodyweight or DB Jefferson Curls\n- rest 30-60sec -\n2min Walk/Jog\n3 Get Ups/side (Turkish, sandbag, bodyweight, full or only half get up - slow and braced hard)\n1min FLR or Quadruped Hold or Shoulder Taps (keep knees 1\" from ground whole time)\n- rest 30-60sec -","30X0; 3 reps every 60sec x 6 sets\n\n*Aim for RPE 8/10 on the first set and then keep the same weight for the remainder of the sets, even if you need to break up the reps as fatigue increases as the sets go on","21X1; 10,10,10reps; rest 30sec","10reps/side/direction; rest 60-90sec x 3 sets\n\n*Stay in your confident power stance here","20X1; 12-15reps/arm; rest 30sec x 3 sets","3131; 6-8reps/side; rest 30-60sec x 3 sets","10X5; 5-7reps; rest as needed x 2-3 sets\n\n*Emphasize squeezing the glutes and thrusting your pelvis into the pad/bar versus bridging up\n*Remember - you EARNED this lift, so only load as heavy as you can emphasize mind-muscle connection as priority","3 sets:\n10 Crosscable Overhead Tricep Extensions\n- directly into -\n10 Crosscable Tricep Extension\n- directly into -\nBench Push Ups - AMRAP to 7 then 8 then 8-9/10 RPE each set\nrest as needed between sets\n\n*Aim for 7 RPE in set 1 and RPE 7-8 in second set and 8-9 in the last set\n*Reps will go UP in this progression","Warmup  (8 mins) \n\n5min Cardio Your Choice \n+\n2 sets\n1) 10 Scapular Push Up on Elbows @ 2020\n2) 6-8 KB Windmill/side @ 2020\n3) 8-10 DB External Rotations/side @ 2020","Cooldown (5 min) \n\n30 sec/side Tall Kneeling Triceps Stretch \n30 sec/side Childs Pose Lat Stretch \n30 sec Puppy Dog Pose \n10 reps/side Childs Pose Reach Through","30mins Continuous @ Conversational Pace\n2min Walk/Jog\n10 Shinbox Thoracic Rotation/side\n10 Inchworm Push Up\n- rest 30-60sec -\n5min Spin Bike\n30sec Wall Deadbug\n30sec Reverse Plank Bridge Hip Lifts (or just bridge)\n- rest 30-60sec -\n2min Walk/Jog\n3 Get Ups/side\n30sec KB Rack Wall Sit\n- rest 30-60sec -","WELCOME TO WEEK 0!!\nThis is the week where we take the pressure OFF progression, and put the focus on MMC (mind-muscle connection!)\n\nNotes for this week:\nRPE Target - 7-8/10\n*Leave about ~3 reps in the tank before ABSOLUTE failure\n*Leave about 1-2 reps in the tank before FORM failure\n\n*Perform 1-2 warm up sets of half the reps to find your working loads before your first working set. I want you to take your time this week finding what is a TRUE 7/10 this week. Next week, we will keep the reps the same and just bump up RPE, so focus on quality of movement and the TENSION you are putting on the muscles over everything. Next week, the reps will be the same but the RPE will be up - so use this week to your advantage to get some form feedback if you are able to film any movements.\n\nRESULTS:\nPlease record your metrics for each set of each movement as such:\nSet 1: 10reps @ 30lbs - RPE 7 (3 RIR)\nSet 2: 10reps @ 35lbs - RPE 8.5 (1-2 RIR)\nSet 3: 10reps @ 35lbs - RPE 9 (1 RIR)\n***This is crucial for setting yourself up for success in the weeks to come. We will reference these results each week!\n\nFILMING:\n- Best practice is to film your FIRST and LAST set in the first few weeks. This way, you can watch the recording of your first set in your rest period and self-critique your form as you build load through the following sets.\n- Filming the last set helps us notice where we could have pushed a little harder, or where movement quality breakdowns happen. These are helpful tools for us to ensure you are moving well and staying injury-free while pushing the effort!\n\nPlease also make sure you have a consult booked for us!\n\nCoach Bri","31X1; 8,8,8reps; rest 2min\n\n*rest about 3-5sec between each rep to give yourself the BEST chance to control the negative and for mind muscle connection (MMC - we need an abbreviation for this now lol)\n*You are welcome to use lifting straps for this to help with grip so you can better bias your lats","20X2; 8,8,8reps; rest 2min","20X2; 10-12reps/arm; rest 60-90sec x 3 sets\n\nFocuses:\n*Protract and retract the scap at the bottom of each rep to create mind-muscle connection to the lats\n*Work on torso rotation here for core stability\n*Anti-Rotation CORE challenge for you here!","20X1; 12-15reps; rest 60-90sec x 3 sets\n\n*Reps will likely stay the same for this superset to prioritize quality of movement as RPE goes up\n*Keep your chin TUCKED and only come up as high as your GLUTES squeeze you up - do not lift up from the low back. Think about digging your pubic bone into the pad and squeezing your glutes as hard as you can","2-3 sets:\n10 Facing Away Cable Curls\n- directly into - \n10 Squatting Cable Curls\n- directly into -\n10 Standing Cable Curls\n*Still use the two handles, just step in between the cable arms\nrest as needed between sets\n\n*Aim for 7 RPE in set 1 and RPE 7-9-10 in second set and 3rd set if you choose to do it.\n*Reps will go UP in this progression","5min Cardio Your Choice\n+\n2 sets\n1) 10 Runner Lunge Thoracic Rotation/side\n2) 15 Straight Arm Banded Lat Pulldown\n3) 10 Powell Raise/arm @ 2020","30X1; 8,8,8reps/leg; rest 30sec between sides; rest 60sec\n\n*Use straps and ONLY isolate the front/working leg - use a box that is ONLY 6-8\" tall to start and then increase the height if you can bias only the front leg's glute and quad evenly. We want to find the safest degree of hip flexion here, by keeping your midline stable and upright - use the non working hand for stability if needed\n\n*film from the side please!","30-40sec/side; rest 15sec between sides; rest 2min x 3 sets\n\n*If you are shorter on time, you can do L step down, L side plank, then R side :)","30X1; 8.8.8; rest 60-90sec x 3 sets\n\n*Rest 10sec between sets of 8 with the same load on for a total of 24 reps per set\n*Reps will stay the same here - aim to increase quality and load each week","20X2; 12-15reps; rest 60-90sec x 3 sets\n\n*Reps will stay the same here - aim to increase quality and load each week","3 sets @ 75% Aerobic Effort\n15 cals on Bike\n15m Plate Pinch Carry \n12 cals on Bike\n12 Straight Leg Plate Sit Ups\n9 cals on Bike\n9 Plank Body Saws (without sliders, just rock back and forth in your plank)\nrest 90sec\n\n*Controlled and great posture for all core movements. Keep the bike work at a conversational pace that challenges the core movements but you are able to perform great reps under slight aerobic fatigue. This is called \"fatigued abdominals\" - where your core has to work a little harder with the extra demand from the diaphram with the conditioning. Aim to keep your HR below 155/160 BPM.","2-3 sets:\n10/10 Seated Hip Adductions @ 20X2\nrest 30sec\n10/10 Seated Hip Abductions @ 20X2\nrest 30sec\n30sec Plank Reach - move controlled\nrest as needed between sets\n\n*Aim for 7 RPE in set 1 and RPE 7-9-10 in second set and 3rd set if you choose to do it.\n*When you see 10/10 this means a DROP SET - build to a very TOUGH set of 10, then drop one notch and do another set of 10 (when i put 10.10 that is a cluster and you do the same weight, so this is a little different)\n*Focus on the squeeze of the adductors and abductors for 2sec each rep","Warmup (8 mins)\n\n5min Cardio Your Choice\n+\n2 sets\n1) 30sec Psoas March\n2) 10 Standing Box Hip CARs/side/direction\n3) 10 Shinbox Switch/side\n4) 10 Bird Dog/side","1-3 sets:\n10reps of each; rest as needed to keep quality high as possible","20+ mins @ HR between 120-130 BPM","10mins + PT work","30X0; 5 reps every 75sec x 6 sets\n\n*Aim for RPE 8/10 on the first set and then keep the same assistance level for the remainder of the sets, even if you need to break up the reps as fatigue increases as the sets go on\n*OR perform pronated grip lat pull downs if machine is taken","21X1; 10,10,10reps; rest 2min","16-20 alt reps; rest 60-90sec x 3 sets\n*In your rest periods, perform a 30sec Bent or Active Hollow Hold to bring awareness back to bracing and core control.","3111; 6-10reps/leg; rest 30sec between sides; rest 60-90sec x 3 sets","30X0; 12-15reps/arm; rest 30sec between sides; rest 60-90sec x 3 sets\n\n*Anti-Rotation CORE challenge for you here!","31X1; 8,8,8reps/leg; rest 30sec btwn sides; rest 60sec x 3 sets\n\n*we are going to have to play a bit with your foot position here to ensure your low back is gluted to the pad and you are only lowering as far as your hip flexion is strong and stable","8-12 controlled reps per set; rest 15sec between sides; rest 2min x 3 sets","30X1; 8.8.8reps; rest 60-90sec x 3 sets\n\n*load stays the same for all 24 reps with 10sec rest between sets of 8\n*Reps will stay the same here - aim to increase quality and load each week","20X2; 12-15reps; rest 60-90sec x 3 sets\n\n*Reps will stay the same here - aim to increase quality and load each week\n*DIG your pelvis into the pad to ensure you have a stable midline and do not dump into your low back!","10-20mins Continuous @ 75% Aerobic Effort\n3mins Row/Spin/Incline Walk/Stairmaster\n8 Beast to Leg Through/side\n8 Quadruped Shoulder Taps/side\n8 Tall Kneeling to Standing/side (or Quadruped HIp CAR)\n\n*Imagine you are on RICE PAPER during your movements - you want to move as controlled as possible to not rip the paper you are sitting on. Turn on your music and just flow thorugh these movements","2-3 sets:\n15-20 Assisted Hip Airplanes/side\nrest 30sec\n14-20 Low Switch Cossack Squats\nrest 30sec\n30sec Tuck L Hang\nrest as needed between sets\n\n*Aim for 7 RPE in set 1 and RPE 7-9-10 in second set and 3rd set if you choose to do it.\n*Treat these movements like the adduciton/abduction, really challenge those muscles with as much MMC as you can.","WELCOME TO WEEK 1!\nNotes for this week:\nRPE Target - 8/10\n*Leave about 2 reps in the tank before ABSOLUTE failure\n*Leave about 1 rep in the tank before FORM failure\n\nRESULTS:\nPlease record your metrics for each set of each movement as such:\nSet 1: 10reps @ 30lbs - RPE 7 (3 RIR)\nSet 2: 10reps @ 35lbs - RPE 8.5 (1-2 RIR)\nSet 3: 10reps @ 35lbs - RPE 9 (1 RIR)\n***This is crucial for setting yourself up for success in the weeks to come. We will reference these results each week!\n\nFILMING:\n- Best practice is to film your FIRST and LAST set in the first few weeks. This way, you can watch the recording of your first set in your rest period and self-critique your form as you build load through the following sets.\n- Filming the last set helps us notice where we could have pushed a little harder, or where movement quality breakdowns happen. These are helpful tools for us to ensure you are moving well and staying injury-free while pushing the effort!\n\nPlease don't hesitate to reach out if you have any questions!\n\nCoach Bri","30X1; 8-12reps; rest 60sec x 3 sets\n\n*Use straps. \n*We want to find the safest degree of hip flexion here, by keeping your midline stable and upright\n\n*film from the side please!","3 sets @ 75% Aerobic Effort\n15 cals on Bike\n15sec Star Plank/side\n12 cals on Bike\n12 Supine Toes to Bar\n9 cals on Bike\n9 Plank Knee to Elbow/side\nrest 90sec\n\n*Controlled and great posture for all core movements. Keep the bike work at a conversational pace that challenges the core movements but you are able to perform great reps under slight aerobic fatigue. This is called \"fatigued abdominals\" - where your core has to work a little harder with the extra demand from the diaphram with the conditioning. Aim to keep your HR below 155/160 BPM.","31X1; 8-12reps; rest 60sec x 3 sets\n\n*we are going to have to play a bit with your foot position here to ensure your low back is gluted to the pad and you are only lowering as far as your hip flexion is strong and stable","10-20mins Continuous @ 75% Aerobic Effort\n3mins Row/Spin/Incline Walk/Stairmaster\n8 Front Plank to Down Dog\n8 Underswitch Crab Reach, 4/side\n8 Reverse Plank Bridge Hip Lift\n\n*Imagine you are on RICE PAPER during your movements - you want to move as controlled as possible to not rip the paper you are sitting on. Turn on your music and just flow thorugh these movements","WELCOME TO WEEK 2!\nNotes for this week:\nRPE Target - 8-9/10\n*Leave about 1-2 reps in the tank before ABSOLUTE failure\n*Leave about 0-1 reps in the tank before FORM failure\n\nRESULTS:\nPlease record your metrics for each set of each movement as such:\nSet 1: 10reps @ 30lbs - RPE 7 (3 RIR)\nSet 2: 10reps @ 35lbs - RPE 8.5 (1-2 RIR)\nSet 3: 10reps @ 35lbs - RPE 9 (1 RIR)\n***This is crucial for setting yourself up for success in the weeks to come. We will reference these results each week!\n\nFILMING:\n- Best practice is to film your FIRST and LAST set in the first few weeks. This way, you can watch the recording of your first set in your rest period and self-critique your form as you build load through the following sets.\n- Filming the last set helps us notice where we could have pushed a little harder, or where movement quality breakdowns happen. These are helpful tools for us to ensure you are moving well and staying injury-free while pushing the effort!\n\nPlease don't hesitate to reach out if you have any questions!\n\nCoach Bri","WELCOME TO WEEK 3!\nNotes for this week:\nRPE Target - 8-9/10\n*Leave about 1-2 reps in the tank before ABSOLUTE failure\n*Leave about 0-1 reps in the tank before FORM failure\n\nYour goal the next few weeks is to progressively overload.\n\nYou have the option to manipulate the:\n*TEMPO (adding more squeeze in each rep or slowing the eccentric to load the tissues more), \n*REPS (if you were at the lower end last week, do more reps at that weight this week) or \n*LOAD (conversely, if you were on the higher end, see if you can bump up load!).\n*SETS (if you noticed your first working set was not an optimal effort, consider that first set a warm up and do another set at the target RPE for the day).\n\nPlease don't hesitate to reach out if you have any questions!\n\nCoach Bri","Welcome to week 4!\n\nYou will notice some slight progressions to your finishers and to some of the core-to-extremity movements we are working on buildiing resilience with.\n\nThis week, we are keeping the reps the same. The ONLY main rep change is that we are adding a Myo set on your last set of your primary strength movement each day. This means, if the rep Rx is 8 reps, do your 8 reps to 8-9 RPE, then rest 15-20sec, and then see if you can squeeze out a few more reps. Ideally, you will only get 1-3 more reps if you are hitting that 8-9 RPE in the first set. In the Myo set, do NOT reach for compensation patterns, keep your quality high but push that effort for the squeeze in the positions.\n\nYou will see some progressions in reps for the upper finishers and core movements aswell :)","41X1; 6,6,6reps; rest 2min\n\n*Aim for a 4sec+ negative with slightly less reps","20X2; 8,8,8reps; rest 2min\n+\nMyo set on last set - film last set","20X2; 8-12reps/arm; rest 60-90sec x 3 sets\n\nFocuses:\n*Protract and retract the scap at the bottom of each rep to create mind-muscle connection to the lats\n*Work on torso rotation here for core stability\n*Anti-Rotation CORE challenge for you here!","2-3 sets:\n12 Facing Away Cable Curls\n- directly into - \n12 Squatting Cable Curls\n- directly into -\n12 Standing Cable Curls\n*Still use the two handles, just step in between the cable arms\nrest as needed between sets\n\n*Aim for 7 RPE in set 1 and RPE 7-9-10 in second set and 3rd set if you choose to do it.\n*Reps will go UP in this progression","30X1; 8,8,8reps/leg; rest 30sec between sides; rest 60sec\n\n*Use a 26lb KB and lower as SLOW as possible in this first week - do it barefoot and really focus on gripping the box/bench with the toes. I want you to focus on lowering with the working leg NOT reaching for the floor with the non-working leg.\n*ONLY lower as far down as you feel ACTIVE in the bottom and stay upright if possible.","30X1; 8.8.8; rest 60-90sec x 3 sets\n\n*Reps will stay the same here - aim to increase quality and load each week","3 sets @ 75% Aerobic Effort\n15 cals on Bike\n20 Alt Quadruped Plank Pull Through\n12 cals on Bike\n10 Half Kneeling KB Windmill/side\n9 cals on Bike\n20 KB Russian Twists\nrest 90sec\n\n*Controlled and great posture for all core movements. Choose different or same KB weighs to ensure your quaity is the highest.","2-3 sets:\n5sec hold + 15 Seated Hip Adductions @ 20X2\nrest 30sec\n5sec hold + 15 Seated Hip Abductions @ 20X2\nrest 30sec\n30sec McGill Sit Up/side\nrest as needed between sets\n\n*Aim for 7 RPE in set 1 and RPE 7-9-10 in second set and 3rd set if you choose to do it.\n*When you see 10/10 this means a DROP SET - build to a very TOUGH set of 10, then drop one notch and do another set of 10 (when i put 10.10 that is a cluster and you do the same weight, so this is a little different)\n*Focus on the squeeze of the adductors and abductors for 2sec each rep","21X1; 10,10,10reps; rest 2min\n+\nMyo set on last set","10-15reps/ar; rest 60-90sec x 3 sets\n\n*In your Rest Periods, perform 30-40sec Bottom of squat Hold","8-12reps/leg; rest 30sec between sides; rest 60-90sec x 3 sets","30X0; 10-15reps/arm; rest 30sec between sides; rest 60-90sec x 3 sets\n\n*Anti-Rotation CORE challenge for you here!","3 sets:\n12 Crosscable Overhead Tricep Extensions\n- directly into -\n12 Crosscable Tricep Extension\n- directly into -\nDiamond Push Ups - AMRAP to 7 then 8 then 8-9/10 RPE each set\nrest as needed between sets\n\n*Aim for 7 RPE in set 1 and RPE 7-8 in second set and 8-9 in the last set\n*Reps will go UP in this progression","20-30sec/side; rest 15sec between sides; rest 2min x 3 sets","10-20mins Continuous @ 75% Aerobic Effort\n3mins Row/Spin/Incline Walk/Stairmaster\n8 Beast to Leg Through\n16 Goblet Low Cossack Switch\n16 Cat Cow\n\n*Imagine you are on RICE PAPER during your movements - you want to move as controlled as possible to not rip the paper you are sitting on. Turn on your music and just flow thorugh these movements","2-3 sets:\n15-20 Weighted Hip Airplanes/side\nrest 30sec\n14-20 Single Leg DB Glute Bridge/leg\nrest 30sec\n30sec Hanging Oblique Raise\nrest as needed between sets\n\n*Aim for 7 RPE in set 1 and RPE 7-9-10 in second set and 3rd set if you choose to do it.\n*Treat these movements like the adduciton/abduction, really challenge those muscles with as much MMC as you can.","Have some FUN with this session and use this session to get your mind RIGHT for the test tomorrow. Every single rep you need to repeat the mantra that connects you to feeling your BEST self tomorrow. You have everything you need to be successful, and with your brain on board, you are unstoppable!\n\nI want you to do each set like a straight set if you have the time. I want recovery to be main focus here.","30-40sec/side x 2 sets","10reps/side x 2 sets","8-12reps/arm; rest 60sec x 3 sets\n\n*ensure core is braced!","30X1; 20reps; rest 60-90sec x 2 sets","2-3 sets:\n15-20 Kneeling Cable Crunch\n15-20 Supine Toes to Bar\nrest 60sec","GO FOR IT","10min Row/Bike/Stairs\n+\n1-2 Sets:\n10m Piriformis Walks\n10m Walking Quad Stretch with Reach\n10m Hip Opener Walk\n10m Low Cossack Walks\n10 Runner Lunge Thoracic Rotation/side\n10 Scorpions w/ chest opener/side\n10-20 Dynamic Frog Stretch\n10-20 Shinbox Switch\n*Perform 2 sets if you are particularly tight today!\n\n+\nSprint Accelerations\nSet 1 - Start at 50% and end at 70%\nSet 2 - Start at 65% and end at 85%\nSet 3 - Start at 70-80% and end at your safest sprint effort for today\n+\nWalk 2mins after last sprint effort and go right into your intervals or jog for the day.","Welcome to week 5!\nNow that you have the hang of the Myo sets, we are going to progressively overload from last week. DO WANT you to film your lower body single leg movements from behind to ensure you are not letting that hip drop - keep that lower core BRACED HARD on both sides!","1-3 sets:\n10reps of each; rest as needed to keep quality high as possible\n   \n3x","Welcome to week 6!\nThis is your 3rd week of these reps. Your goal is to find that safest edge. Please also communicate to me about how your body feels and if you are craving a bit of a deload or transition week, as you have been doing a GREAT job with consistency and communcation this cycle!","Welcome to week 5!\nNow that you have a great idea of what you can handle for that starting set of 5, your goal this week is to progressively overload from one of the following ways, OR simply just choose the loads that really match the RPE target!\n\n*TEMPO (adding more squeeze in each rep or slowing the eccentric to load the tissues more), \n*REPS (if you were at the lower end last week, do more reps at that weight this week) or \n*LOAD (conversely, if you were on the higher end, see if you can bump up load!).\n*SETS (if you noticed your first working set was not an optimal effort, consider that first set a warm up and do another set at the target RPE for the day).\n\nPlease continue to film and let me know when you upload in the messages OR just anticipate me reviewing all videos at the end of the week!\n\nCoach Bri","1.1.1reps; rest 90sec-2min between sets x 5 sets","5,10,15reps; rest 90sec-2min between sets\n   \n5@35\n10@30\n15@25\n\n5@35\n10@30\n15@25","30X0; AMRAP @ RPE 10 x2 sets; rest 60 sec","Welcome to week 1!\n\nThis week is all about finding our new FLOW with our two upper sessions per week and your two lower sessions at PT.\n\nThis week, i want you to send me a video of EACH movement so that I can form review.\nBest practice is to film your FIRST and LAST set in the first few weeks. This way, you can watch the recording of your first set in your rest period and self-critique your form as you build effort through the following sets.","6-10 reps RPE 8\n-rest 90 sec-\n10-15 reps RPE 9\n-rest 90 sec-\n15-20 reps RPE 10\n\n*Pre-Fatigue","20X2; 8-12reps/arm; rest 90sec-2min between sets x 3 sets\n+\n1 Dropset per side; rest between - aim for 15-20reps for a great lat pump and great shoulder and core mechanics","12-15reps @ RPE 10 x 2sets; rest 60 sec","Accumulate 2mins per side; switch sides and rest as needed","5min Cardio Your Choice \n+\n2 sets\n1) 10 Quadruped Thoracic Rotations/side\n2) 6-8 Half Kneeling DB Windmill Press/side @ 2020\n3) 10 DB External Rotations/side\n4) 10 Prone Snow Angels. - controlled","record results here","5 reps lowering as SLOW as possible; rest up to 8sec between reps; rest 90sec x 4 sets\n\n*Your biggest challenge here is to keep your pelvis neutral, core braced, and focus on the lats, biceps and upper back.\n* I really want you to take your time here and stress the lats. If you point your toes and squeeze the glutes, you should be in a great position for these negatives","8-12reps/side; rest 30sec between sides; rest 90sec x 3 sets\n\n*BRACE hard for this anti-rotation work - your elbow does not have to travel past the torso","12-20 reps RPE 10 x2 sets; rest 60 sec\n\n*do this on the floor or bench - keep feet on the floor and low back glued to the ground/bench -- choose whichever allows you to lay flat on your back with a neutral spine and braced core.","Accumulate 3mins total with 35lb KB; break up as much as needed; and only break it up when you lose integrity of the peak muscle contraction at the top","Welcome to week 2!\n\nDepending when your surgery date is, we will follow a similar plan to last week to keep you strong going into surgery!","3111; 8-10reps/leg; rest as needed x 2","10-20 alt reps; rest as needed x 2","20-30sec/side rest as needed x 2","Accumulate 45-60sec/side; rest as needed x 2","1-2 sets:\n20 Chest Support Y Raise\n20 Incline Bicep Curl\n20 Incline Skull Crushers\n- rest as needed -","Accumulate 60sec; rest as needed x 2\n\n*add a glute loop around quads for some abductor engagement if feeling good. keep the resistance light, just enough to feel the engagement.","10-20 reps/arm/ rest as needed x 2\n\n*ensure you are in a comfortable seated position on floor or bench so you can keep spine neutral and core engaged\n*wedge your elbow into the inside of your knee for extra stability to rotate from.","3030; 6-10reps/leg; rest as needed x 2","8-12reps; rest as needed x 2","1-2 sets:\n30sec Deadbug Hold (hold weight in hands if able)\n20 Preacher Curls\n20 Chest Support Lateral Raise\n- rest as needed - \n\n*Preachers - use support so your torso is stable.","Accumulate 60sec; rest as needed x 2","2020; 10-20 reps; rest as needed x 2\n\n*keep core engaged!","10-20reps; rest as needed x 2","30-40sec continuous; rest as needed x 2\n\n*Use this to explore the hips with pauses where it feels juicy!","1-2 sets:\n20 Rope Tricep Push Down\n20 Rope Bicep Curl\n30sec Modified Side Plank/side\n- rest as needed -","20X2; 6-10reps/side; rest as needed x 2\n\n*LIGHT REPS","1-2 sets:\n20 Chest Supported Lateral Raise\n20 Zottman Curl (great for wrist!)\n20 Incline EZ Bar Skull Crushers (slightly lower than 45 degree angle)\n- rest as needed -","15-20 reps/arm/ rest as needed x 2\n\n*ensure you are in a comfortable seated position on floor or bench so you can keep spine neutral and core engaged\n*wedge your elbow into the inside of your knee for extra stability to rotate from.","8-12reps; rest as needed x 2\n\n*add 2.5 change plates in hands for extra challenge - keep chin tucked!","1-2 sets:\n30sec Wall Deadbug \n20 Cross Cable Lateral Raise\n20 Cross Cable Rear Delt Fly\n- rest as needed - \n\n*film one set of cable work please - do this kneeling if needing more stability for the back","Accumulate 10-20reps with 2sec squeeze at the top/rep; rest as needed x 2","2020; 10-15 reps; rest as needed x 2\n\n*keep core engaged!","15-20reps; rest as needed x 2","40-60sec continuous; rest as needed x 2\n\n*Use this to explore the hips with pauses where it feels juicy!","1-2 sets:\n20 Rope Tricep Push Down\n20 Rope Bicep Curl\n30sec Modified DB Side Plank/side\n- rest as needed -","NOTE - we may change up movements this week based on feedback","This week will be \u201cweek 0\u201d where your only goal is to test out all the movements without the pressure of loading or focusing on RPE.\n\nJust putting in quality reps, learning the tempo (where to squeeze and where to slow down on the eccentric) and to film so I can form review for you and give you form feedback before we start progressing these lifts in the weeks to come.\n\nPlease ensure you are filming so that i can see the joints that are expressed and your hip/core positioning.\n\nWe are starting with higher reps and lower sets. In the weeks to come, we will increase volume of sets as you adapt over the next 4-6 weeks. Then, once we hit 3-4 sets for everything unscathed, then we will start playing with dropping the reps and pushing the weight even more. This week - really honor tempo Rxs and focus on the SQUEEEEZE and core engagement.....\n\nPlease notice that every SINGLE movement has a core component to it. THIS is your opportunity to treat every single movement like a core movement -- i want you bracing your core like a pressurized can of Diet Coke every. single. rep. If you start to lose that engagement, put the weight down, reset and finish your reps.","Accumulate 40reps; rest as needed as you chip away!","10X2; 10-15reps; rest as needed x 2\n\n*LIGHT REPS - squeeze scaps together and keep low back relaxed here but abs tight!\n*if it feels better on back to set up with hips off the side bench (belly on bench( and feet on the floor, that is all good!","3111; 8-10reps/leg; rest as needed x 2\n\n*GOBLET LOADED PLEASE!!!!","31X1; 10-15reps/arm; rest as needed x 2","10X4; 8-12reps/leg; rest 30sec between sides; rest as needed x 2 sets","40-60sec continuous; rest as needed x 2\n\n*Use this to explore the hips with pauses where it feels juicy!\n*If feeling good, you can do Seated Hip Adduction for the same volume/time instead of Shinbox","2 sets:\n20 Kneeling Cable Cruches\n20 Rope Tricep Push Downs\n20 Rope Curl\n- rest as needed - \n\n*Squeeze as much engagement as you can for 1sec at the top of EACH rep of EACH movement.","5mins Cardio Your Choice\n+\n2 Sets:\n30sec Dynamic Frog Stretch\n15 Quadruped Scapular Push Ups\n15 Cuban Press (banded or DBs)","Accumulate 20-30reps per side; switching every 4-6 reps\n\n*film a few reps per set","3131; 6-10reps; rest as needed x 2\n\n*only go as low as you can stay active in the glutes and core - no bottoming out.","15-20 reps/arm; rest as needed x 2\n\n*Sit on a medball with the DB and then bridge up from there","10X3; 10-12reps; rest as needed x 2","20X1; 10-15reps/arm; rest as needed x 2","30sec continuous/side; rest as needed x 2\n\n*Use this to explore the hips with pauses where it feels juicy!\n*If feeling good, you can do Seated Hip Abduction for the same volume/time instead of weight shift","2 sets:\n30sec Plank Psoas March\n20 Incline DB Skull Crushers\n20 Incline DB Bicep Curl\n- rest as needed - \n\n*Squeeze as much engagement as you can for 1sec at the top of EACH rep of EACH movement.","5min Cardio Your Choice\n+\n2 sets\n1) 10 Quadruped Thoracic Rotations/side\n2) 20 Band Pull Aparts\n3) 10 Reverse Plank Bridge Hip Lift/side","31X1; 8-12reps; rest 90sec x 3 sets","10X3; 8-12reps; rest 90sec x 3 sets\n\n*Emphasize the squeeze of the lower traps each rep\n*Please FILM ONE SET FROM THE SIDE/BACK ANGLE so i can see both scaps -- in tank ideally!","15-20reps LEFT\n- rest 45sec -\n15-20reps RIGHT\n- rest 45sec - \nx 3-4 sets total\n\n*Use the incline bench as your elbow support for Preacher curls","15-20reps; rest 45sec x 3-4 sets\n\n*keep that lower core engaged and low back pressed firmly into the bench","30sec Wall Dead bug*\n30sec Rest\n30sec Assisted Hip Airplanes**\n30sec Rest\n30sec Assisted Hip Airplanes\n30sec Rest\nx 2-4 Rounds until quality of movement starts to taper\n\n*Push hard into the wall so that your upper core is engaged, press low back into the floor for lower core stability, only lower legs to about 45 degrees where your hip flexors stay engaged the whole time.\n*Put your back toe on a bench if needed to take pressure off low back and focus mainly on the hip rotations.","WELCOME TO WEEK 1!\nI know you had a blaaassst while you were here in Chi, so today, we use those fun experiences and moments to fuel us in \"grind mode.\" We are back home and getting back into action. \n\nThis week - I want you to\n1. Track ALL YOUR FOOD for the entire week. Yep. I said it. THE ENTIRE WEEK. This is my challenge to you. I want even the weekend fully tracked, Paper Planes and all. We want an honest, true representation of your food this week. I want you to send a screen recording of your completed log EACH NIGHT before bed.\n\n2. Training - I want you emphasizing GREAT MOVEMENT this week. Focus on squeezing at the back of each rep, keeping mind-muscle connection in the eccentric, FOCUS on the muscles you are biasing. The more. your mind is active during your training, the more your CNS gains confidence that you're healing.\n\n3. Lifestyle - SLEEP. SLEEP. SLEEEEEEP. In order for us to maintain muscle protein synthesis and energy to \"do the thing\" - you need to sleep. I am also saying this to myself - maybe we can hold each other accountable on this one :)\n\nThat's it!\nLet's hit week 1 of this new build with an RPE 7-8/10. Use that 2-3 RPE left in the tank to focus on SQUEEZING and TEMPO and HOLDING where we need more mind-muscle connection (cough cough - lats and lower core).\n\nBri","WELCOME TO WEEK 2!\n\nContinue logging your food this week. I challenge you to pre-log for the whole week, including the weekend. Then, make tweaks as you go throughout the day, so at least you have a blueprint based on my nutriitonal feedback.\n\nThis week, we are keeping everything the SAME to minimize variables and ensure we are giving you the best chance at recovery by auto-regulating your effort and loading.\n\n135 feeling heavy on the DL? great, focus on qualty of bracing and tempo.\n135 feeling pretty good? great, add 2.5 of 5lbs on each side and make it feel just as good.\n\nFor all your other movements, especially upper body work:\nIf You Start Too Light:\nYou\u2019re mid-set and realize the weight isn\u2019t cutting it for the RPE target? You\u2019ve got options:\n1. Stop the set and go heavier. Adjust mid-session. It happens.\n2. Treat it as your last warm-up. No harm\u2014just log it and move on.\n3. Keep going and chase the right RPE. Do as many reps as it takes to hit that effort zone, then use that info to level up next week.\nNo reps are wasted if you\u2019re learning from them.\n\nIf You Start Too Heavy:\nPushed too far, too soon? Here\u2019s how to pivot without burning out:\n1. Hit as many quality reps as you can. Don\u2019t grind\u2014just go to form failure or your RPE cap.\n2. Rest briefly. Catch your breath, reset your brace.\n3. Squeeze out 1\u20132 more reps. Only if your form stays locked in.\nThis keeps the intensity high without wrecking your set\u2014and gives you a new benchmark to work from.\n\nLET'S FUCKING GET IT!\n\nBri","Welcome to week 1 of your FULL BODY BUILD! I have now added back squat and deadlift to your training. You'll see that on your second two workouts. Assuming you'll keep up with Kaitlyn on Tuesdays, I gave you complementary movements in this session to set you up for success in that session.\nPlease film your back squat and deadlifts each week for your OWN review and for my review. Submit videos via messages and I will be doing form reviews on Fridays!\n\nLET'S DO IT! NEW PHASE!!!","8-12reps with 3-5 sec lower; rest as needed between reps; rest 90sec between sets x 3 sets\n\n*Emphasize the squeeze of the lower traps each rep\n*Please FILM ONE SET FROM THE SIDE/BACK ANGLE so i can see both scaps -- in tank ideally!","15-20reps LEFT\n- rest 45sec -\n15-20reps RIGHT\n- rest 45sec - \nx 3 sets total","10X3; 6-10reps; rest 90sec x 3 sets","15-20reps; rest 45sec x 3-4 sets\n\n*keep that lower core engaged and low back pressed firmly into the floor","40-60sec continuous/side; rest as needed x 2\n\n*Use this to explore the hips with pauses where it feels juicy! Keep your shoulders stacked on top of the hips the whole time with core braced.","3131; 6-10reps; rest as needed x 2-3 sets","15-20 reps/arm; rest as needed x 2-3\n\n*Sit on a medball with the DB and then bridge up from there","10X3; 10-12reps; rest as needed x 2-3","GREAT job on week 1 of your new build. I saw some days didn't get fully completed, and that is OKAY! As you continue with this build, the timing should naturally shorten up a bit. if you need me to make any adjustments, you know where to find me! (aka text me!)\n\nThis week, your goal is to explore what your body is safely capable of.\n\nIf You Start Too Light:\nYou\u2019re mid-set and realize the weight isn\u2019t cutting it for the RPE target? You\u2019ve got options:\n1. Stop the set and go heavier. Adjust mid-session. It happens.\n2. Treat it as your last warm-up. No harm\u2014just log it and move on.\n3. Keep going and chase the right RPE. Do as many reps as it takes to hit that effort zone, then use that info to level up next week.\nNo reps are wasted if you\u2019re learning from them.\n\nIf You Start Too Heavy:\nPushed too far, too soon? Here\u2019s how to pivot without burning out:\n1. Hit as many quality reps as you can. Don\u2019t grind\u2014just go to form failure or your RPE cap.\n2. Rest briefly. Catch your breath, reset your brace.\n3. Squeeze out 1\u20132 more reps. Only if your form stays locked in.\nThis keeps the intensity high without wrecking your set\u2014and gives you a new benchmark to work from\n\nLET'S GET ITTT\nCoach Bri","Way to keep crushing it. I am being very conservative on my intensification techniques right now, but they are in my back pocket and ready for you when the time is right.\n\nI want to keep building CONFIDENCE and THEN load. \n\nThis week, we\u2019re keeping reps the same. Your goal is to explore progressive overload through smarter, more intentional movement. Think MMC (mind-muscle connection), TUT (time under tension), ROM (range of motion), and RPE (rate of perceived exertion).\n\nPrioritizing the quality of your movement (how well you execute each rep) is a powerful form of auto-regulation. It keeps you tuned in to your body, protects you from burnout, and helps you build strength that lasts.","Welcome to week 4!! This week, We are going to play with some progressions!! I want to keep the reps the SAME and add a Myo Set. We want to keep playing with slightly higher volume, so by adding a Myo set, we are allowing you to truly find your most confident edge with each movement. Especially the bigger compound lifts.\n\nYour RPE target is still 7-8/10. For Myo Sets, I want you to take the mindset of \"okay, how many more of the HIGHEST quality reps can I get?\" Get those few extra reps ONLY if you have that mindset. In those Myo reps, also really focus on the SQUEEEEZE. \n\nFor the Upper body Myo Sets - GO FOR IT on those. Really push, but only if core is braced and pelvis is neutral!\n\nAlso -- think about the PELVIC FLOOR this week. This is the lowest part of your core that we need to brace in order to be \"fully braced.\" It may sound silly, but doing a mini kegel can really help with core stability!","31X1; 8-12reps; rest 90sec x 3 sets\n+\nrest 20sec after last set\n+\nMYO SET*\n\n*Keep the same weight on the machine after your last rep of your last set, rest 20sec, then perform as many MORE reps as you can until technical (not abolute) failure.","20X2; 8-12reps; rest 90sec between sets x 3 sets\n\n*Let's keep progressing on the pull up machine! New tempo = new stimulus. 2sec hold at the top - think \"how low can i get my elbows  toward my hips?!\"","5sec hold + 12-15reps LEFT\n- rest 45sec -\n5sec hold + 12-15reps RIGHT\n- rest 45sec - \nx 3 sets total\n\n*On LAST SET perform a Myo Set - do the Left side, rest 20sec then do the myo set. then rest 45sec and do the right.","10X3; 6-10reps; rest 90sec x 3-4 sets","30sec Wall Dead bug*\n30sec Rest or EZ Cardio\n30sec Assisted Hip Airplanes**\n30sec Rest or EZ Cardio\n30sec Assisted Hip Airplanes\n30sec Rest or EZ Cardio\nx 2-4 Rounds until quality of movement starts to taper\n\n*Push hard into the wall so that your upper core is engaged, press low back into the floor for lower core stability, only lower legs to about 45 degrees where your hip flexors stay engaged the whole time.\n*Put your back toe on a bench if needed to take pressure off low back and focus mainly on the hip rotations.","Accumulate 10 Pelvic tilts, THEN 20reps; rest as needed x 2 sets","10X4; 8-12reps/leg; rest 30sec between sides; rest as needed x 3 sets\n\n*extra set this week!\n*RIBCAGE DOWN - full core (including pelvic floor) braced here! \n*Build through the sets.","10X2; 10-15reps; rest as needed x 2\n+\nMyo Set on last set\n\n*LIGHT REPS - squeeze scaps together and keep low back relaxed here but abs tight!\n*if it feels better on back to set up with hips off the side bench (belly on bench( and feet on the floor, that is all good!","31X1; 8-12reps/side; rest 30sec between sides; rest as needed x 2\n\n*This week you are going to hold a light DB in the OUTSIDE HAND only.\n*1sec pause in bottom is ACTIVE with core and hips braced -- hover or keep contact with TENSION","2 sets:\n10.10 Kneeling Cable Cruches\n10.10 Rope Tricep Push Downs\n10.10 Rope Curl\n- rest as needed - \n\n*Squeeze as much engagement as you can for 1sec at the top of EACH rep of EACH movement.\n*Rest 10sec between clusters","5-10sec hold in bottom of first rep\n+\n10-12reps\n- rest as needed, then perform other side - \nx 2 sets\n\n*film a few reps per set\n   \n10\u201d+12 @20x2","3131; 6-10reps; rest as needed x 3 sets","12-15 reps/arm; rest as needed x 2-3\n+\nMYO SET ON LAST REP\n\n*Sit on a medball with the DB and then bridge up from there","10X3; 10-12reps; rest as needed x 2-3\n+\n10-20sec hold at the top on the last set (drop weight or keep weight in hands)","20X1; 10-15reps/arm; rest as needed x 2\n+\nMYO SET","40-60sec continuous; rest as needed x 2\n\n*see if you can use less assistance now, and stay low to feel that adductor stretch","2 sets:\n30-40sec Plank Psoas March\n10.10 Incline DB Skull Crushers\n10.10 Incline DB Bicep Curl\n- rest as needed - \n\n*Squeeze as much engagement as you can for 1sec at the top of EACH rep of EACH movement.\n*rest 10sec between clusters","Welcome to week 5!\nLast week, we introducted MYO SETS and made a few movement changes (pull up machine, suitcase RNT ss). \n\nThis week, I want you to use what you learned last week to progress a bit this week. You have a few options but I want the MAIN FOCUS to be \"how many more QUALITY reps can i get this week?\" or \"how much BETTER can I make my RNT SS feel this week?\"\n\nTHIS is where the real magic is: BRACING AND CORE STABILITY -- self-check before each rep to ensure your core is braced:\n1. Ribcage locked down\n2. intra-abdominal pressure locked in\n3. Pelvic floor engaged (from 3\" below belly button to \"kegel zone\")\n\nLet me know how this focus goes!\nAND keep tracking that food -- text over food logs each week and TAKE PROGRESS PHOTOS!","5-10sec hold in bottom of first rep\n+\n10-12reps\n- rest as needed, then perform other side - \nx 2 sets\n\n*film a few reps per set","Welcome to week 5! This week we squeeze out as much MMC or engagement from the Myo Sets.\n\nThis week, I want us to start getting curious about what heavier loads would feel like for you IF you had less reps - Start anticipating how strong you will feel )","Hi you!\nI\u2019m officially in Costa Rica now, so please feel free to text me for anything urgent while I\u2019m away.\n\nAnd\u2026 next week is Christmas!\n\nLet\u2019s set ourselves up for success by continuing to prioritize protein prep, hydration early in the day, and consistent steps or movement snacks whenever you can fit them in. These are the small but powerful anchors that keep your body and brain steady during a busy season.\n\nThe biggest WIN you can give yourself this holiday is finding that balance between true recovery and being present with the people you love. Remember: it is completely okay to step away for 5\u201310 minutes to let your nervous system reset. These quick, intentional breaks allow your brain to process the stimulation of the day\u2014and they make you more grounded, regulated, and engaged when you come back. Please use this time to reflect on your ideals list and vision for your life 10 years from now. The more you consider who that person is, the more your actions and behaviors respond.\n\nThis week, we\u2019re re-focusing on MMC, TUT, RPE, and ROM. This is week 0, so I want put your attention on making every rep feel strong, controlled, and high-quality. This week and next week are intentionally designed with the same rep schemes so you can squeeze out as much adaptation and confidence as possible before the new year. \n\nYou\u2019ve got this.\u2028\n\nYours in health,\u2028\nCoach Bri","Pre-Fatigue:\n15reps/leg*; rest 60sec x 3 sets\n\nSet 1: Toes In\nSet 2: Toes Up\nSet 3: Toes Out","10X2; 8-10reps every 90sec x 5 sets\n\n*treat this like an EMOM clock -- i use the app \"4Time\" to do 90sec intervals for me.\n*FILM FROM BACK/SIDE ANGLE PLEASE","31X1; 6-10reps x 2 sets\n+\n30X0; 8-12reps x 2 sets\n- rest 2min between each set - \n\n*the first two sets i want you to honor your pauses and really focus on quality movement and tempo. the second two sets without pauses, but more reps you *should* be able to keep a similar load.\n*FILM ONE SET OF EACH to see tempo","31X1; 10-15reps; rest 30sec between arms; rest 60sec","15-20reps/arm; rest 60sec x 3 sets","Tabata (4-6min total):\n20sec Adduction Bias SL RDL LEFT\n10sec Rest\n20sec Adduction Bias SL RDL RIGHT\n10sec Rest\n20sec KB or DB Deadbug (same weight as RDL)\n10sec Rest\nx 3-4 sets\n\n*If needed, add an extra 30-60sec rest between sets to keep mind-muscle connection and movement quality the highest possible.\n*Start very light in week 0-1","Warmup  (8 mins) \n\n3-5 min Cardio of Choice\n+\n2-3 Sets\n1) 10 Quadruped Hip CARs/side\n2) 10 Bird-Dog/side\n3) 10 Squat Plus Thoracic Rotation/side (use leverage with the non-working hand to reach up)\n4) DB External Rotations x 10/arm","Pre-Fatigue:\n10.10.10reps (rest 10sec between sets of 10 for 30reps/set); rest 30-60sec x 3 sets\n\n*After each set, perform AMRAP Knee Push Ups (aim for 12+ reps)\n\n*Sit at the edge of the seat and hinge over so you can feel the stretch of the hamstrings slightly - keep as much weight in your FEET as you can while performing the movement. You can put your hands on the machine in front for stability if needed","3111; 8-12reps; rest 30sec x 4 sets\n\n*Re-commit to bracing the core at the top of each lift. Keep the ribcage locked down and the 2\" below belly button to your pelvic floor braced HARD. Keep the highest amount of mind-muscle connection to the glutes and hamstrings without the low back taking over.","31X1; 6-10reps/arm; rest 30sec between arms; rest 90sec between sets x 4","10-15reps/arm; rest 30-60sec x 3 sets\n\n*slight lean into the lat each rep","20-24reps for quality; rest 60-90sec x 3\n\n*Film one set from the SIDE","30X1; Accumulate 25reps in the shortest amount of time possible\n\n*We are doing this at the end of the session on PURPOSE. We want to practice accumulating volume under fatigue like you will in PFQ","Tabata (4-6min total):\n20sec Split Stance Cable Chop LEFT\n10sec Rest\n20sec Split Stance Cable Chop RIGHT\n10sec Rest\n20sec Kneeling Banded Crunches\n10sec Rest\nx 3-4 sets\n\n*If needed, add an extra 30-60sec rest between sets to keep mind-muscle connection and movement quality the highest possible.","Warmup  (8 mins) \n\n5min Cardio Your Choice \n+\n2 sets\n1) 30sec Passive Hang\n2) 10-15 DB External Rotations/side\n3) 8-10 Jefferson Curls @ 2020\n4) DB External Rotations x 10/arm","1 set:\n\nLat and Shoulder Stretch Series x 30sec/movement\n1min Tspine Can Opener\n5min Static back*\n\n*Perform 5 minutes of static back. Try to inhale through the nose for 3 seconds and exhale through the mouth for 6 seconds. Try to slow the breathing post workout in order to switch from a sympathetic to a parasympathetic state before resuming your day to day. This will help with better nutrient absorption, energy regulation and overall mindset.","Pre-Fatigue:\n20reps; rest 60-90sec x 3 sets\n\n*push yourself HARD into the seat and squeeze for 2sec per rep","8-12reps/leg; rest rest 45-60sec between legs; 90sec-2min x 4 sets\n\n*On your last set, after completing one side, drop the DBs and perform 10-12 bodyweight PULSE REPS. Then rest and perform the other side with weights, then drop the weights and perform a bodyweight set of 10 PULSE reps after.","6-10reps + Myo Set*; rest 60-90sec x 3 sets\n\n*Each set, you will perform a slight MYO set. You will do your 1-1/4 reps, then rest 20 FULL SECONDS, and perform as many more reps as you can of REGULAR hip thrusts (with 2sec hold at the top as well)\n*ALL REPS you will think about scooping your pelvis UP into the pad and squeeze from the adductors and glutes for 2sec each rep","8-12reps; rest 60sec x 4 sets\n\n*Ensure bench is set to 45degrees","2112; 8-12reps; rest 90sec x 4 sets","For Quality\n20 DB Lateral Raise\n20 DB Skull Crushers\n- rest 30sec -\n15 DB Lateral Raise\n15 DB Skull Crushers\n- rest 30sec -\n10 DB Lateral Raise\n10 DB Skull Crushers\n- rest 30sec -\n\n*DB Lateral Raise: emphasize the retraction of the scaps the WHOLE TIME. think about REACHING the hands up and out, not lifting the shoulders (it'll make more sense when you're doing it lol)","2-3 sets\nSide Plank Rotations x 10-15/side\nSupine Pelvic Tilt x 15 (squeeze and hold at top for 2sec/rep)\nTuck L Hang x 15sec\n\n*I want you squeezing out as MUCH core engagement as possible on those pelvic tilts.\n*You should really feel your rear delts a LOT in the rotations - feel the protraction and retraction of the scaps\n*FILM ONE SET of each movement","20reps/side x 1-2 sets","800m Run @ EASY PACE\n- 200m Walk - \n800m Run @ RPE 6/10 PACE\n- 200m Walk - \n\n+\n\n3-5 sets:\n400m Run @ RPE 6-7/10\n*Practice your sprint running form, keeping your hip flexors working hard each rep and core braced.\n\n+\n\nWalk 5-10mins\n\n*DO NOT FORGET TO DO YOUR COOL DOWN BEFORE FINISHING.\n\n*Next build we will add in fatigued running","Accumulate 2:00 per movement, per side (if applicable):\nPidgeon Stretch\nCouch Stretch\nSeated Pike Stretch\nCalf Stretch","Write down your blueprint menu for your protein sources this week. What will you have for breakfast, lunch, pre and post workout snacks, and dinner?\n\n*Don't sleep on the pre-cooked options from TJs or Whole Foods. Even deli meat with some veggies and crackers like an adult lunchable. For a late night snack, Ill have a protein shake and some gluten free cereal or put protein powder with some oat milk and make a pudding with some chocolate chips! Sneaking protein in is going to be KEY","How did you feel this week with your evening routines? Is there anything you will change for next week? Anything you felt proud of and want to repeat next week?","One of the most effective ways to stay out of and avoid burnout is journaling -- it doesn't have to be pen to paper, either. I have played with recording voice memos and saving them. I have also made a \"project\" in ChatGPT for my daily reflections. This really helps me organize my ideas for my different projects and also to clear out any negative energy that is stored in my cells and thoughts before I truly wind down from the day. Usually when I do this, items for my to-do list pop into my brain, and instead of storing them in my brain, I write them down for the next day. This also helps manage burnout and overwhelm. \"Your brain is for creating thoughts -- not storing them.\" Let those ideas take up space! (on a page, not in your brain!)","Welcome to your FIRST REAL week of training!\n\nWIth lots of yummy foods around this week, let's keep our focuses of hydrating and prioritizing lean proteins first thing in the AM. When we \"save our calories\" for big meals later, we often \"undereat to overeat\" -- so it's no longer a willpower game -- it's biology saying, \"hellooo you starved me and now i dont trust you'll give me food again, so i'm gonna make you eat a LOT to ensure we have fuel.\" Let's avoid that trap together by hitting protein, water and FIBER in the am, so we can feel as regulated as possible once those yummy treats are around in the pm. \n\nThis week, we\u2019re keeping reps the same. Your goal is to explore progressive overload through smarter, more intentional movement. Think MMC (mind-muscle connection), TUT (time under tension), ROM (range of motion), and RPE (rate of perceived exertion).\n\nPrioritizing the quality of your movement (how well you execute each rep) is a powerful form of auto-regulation. It keeps you tuned in to your body, protects you from burnout, and helps you build strength that lasts.\n\nRPE Target: 8-9/10","800m Run @ EASY PACE\n- 200m Walk - \n800m Run @ RPE 6/10 PACE\n- 200m Walk - \n\n+\n\n3-5 sets:\n400m Run @ RPE 6-7/10\n*Practice your sprint running form, keeping your hip flexors working hard each rep and core braced.\n\n+\n\nWalk 5-10mins\n\n*DO NOT FORGET TO DO YOUR COOL DOWN BEFORE FINISHING.","Welcome to your FIRST REAL week of training!\n\nRPE Target: 8-9/10","Welcome to your THIRD REAL week of training!\n\nRPE Target: 8-9/10","800m Run @ EASY PACE\n- 200m Walk - \n800m Run @ Increasing pace last 400m\n- 200m Walk - \n\n+\n\n3-5 sets:\n400m Run @ RPE 7-8/10\n*Practice your sprint running form, keeping your hip flexors working hard each rep and core braced.\n\n+\n\nWalk 5-10mins\n\n*DO NOT FORGET TO DO YOUR COOL DOWN BEFORE FINISHING.","Welcome to week 4!! This week, we are going to drop the reps SLIGHTLY. Your goal is to aim for 8-9/10 RPE with the goal of making each rep feel STRONG and smooth. If you are between weights, or choose a weight that is too light or heavy, that is okay! Here's how to tackle it:\n\nFor Rep Sets:\nStarted too light? \n\u2192 Add reps until you hit your target RPE.\n\nStarted too heavy? \n\u2192 Do as many reps as you can at that weight, take a short rest, then squeeze out 1\u20132 more to get closer to your goal.\n\n\ud83d\udc49 That said\u2014if you're dialing in mind-muscle connection, err on the side of starting lighter and doing more reps.\n\n\ud83d\udc49 If you've already got strong MMC and are chasing load, starting heavy and adjusting with a rest-pause is solid.\n\nFor Rep Ranges:\nHit the low end last week?\n\u2192 Try to get more reps at the same weight. Push toward the top of the range.\n\nHit the top end last week?\n\u2192 Time to go heavier. Match the same RPE, even if it means fewer reps\u2014or maybe you surprise yourself and level up.\n\nLet's DO IT!\nCoach Bri","Pre-
