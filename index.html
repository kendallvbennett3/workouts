Fatigue:\n12-15reps/leg*; rest 60sec x 3 sets\n\nSet 1: Toes In\nSet 2: Toes Up\nSet 3: Toes Out","10X2; 6-10reps every 90sec x 5 sets\n\n*treat this like an EMOM clock -- i use the app \"4Time\" to do 90sec intervals for me.\n*FILM FROM BACK/SIDE ANGLE PLEASE","31X1; 6-8reps x 2 sets\n+\n30X0; 8-10reps x 2 sets\n- rest 2min between each set - \n\n*the first two sets i want you to honor your pauses and really focus on quality movement and tempo. the second two sets without pauses, but more reps you *should* be able to keep a similar load.\n*FILM ONE SET OF EACH to see tempo","31X1; 8-12reps; rest 30sec between arms; rest 60sec","10-12reps/arm; rest 60sec x 3 sets\n\n*Squeeze the LOWEST part of your lats here","Pre-Fatigue:\n8.8.8reps (rest 10sec between sets of 8 for 24reps/set); rest 30-60sec x 3 sets\n\n*After each set, perform AMRAP Knee Push Ups (aim for 12+ reps)\n\n*Sit at the edge of the seat and hinge over so you can feel the stretch of the hamstrings slightly - keep as much weight in your FEET as you can while performing the movement. You can put your hands on the machine in front for stability if needed","3111; 6-10reps; rest 30sec x 4 sets\n\n*Re-commit to bracing the core at the top of each lift. Keep the ribcage locked down and the 2\" below belly button to your pelvic floor braced HARD. Keep the highest amount of mind-muscle connection to the glutes and hamstrings without the low back taking over.","31X1; 6-10reps/arm; rest 30sec between arms; rest 90sec between sets x 4\n+\nMyo Set on last set","8-12reps/arm; rest 30-60sec x 3 sets\n\n*slight lean into the lat each rep","30X1; Accumulate 12reps in the shortest amount of time possible; rest 2min and REPEAT\n\n*Record total time to get 12 reps for each set.","Pre-Fatigue:\n15-20reps; rest 60-90sec x 3 sets\n\n*push yourself HARD into the seat and squeeze for 2sec per rep","21X1; 6-10reps; rest 60sec x 3 sets\n+\n1 set AMRAP @ weight used in set 3 @ tempo","2112; 10-15reps; rest 90sec x 4 sets","GREAT JOB these last 3 weeks!!\n\nI love seeing these numbers go up. I also love to see you focusing on quality of RPE and movement.\n\nThis week, we are going to drop the reps SLIGHTLY. This means, your goal is to match that target RPE of the last few weeks, but with slighlty less reps. This may require you to hold pauses better, increase load, or really work on resting the FULL period.\n\nYou are CRUSHING this post-holiday build.","Pre-Fatigue:\n10-15reps/leg*; rest 60sec x 3 sets\n\nSet 1: Toes In\nSet 2: Toes Up\nSet 3: Toes Out","10X2; 6-8reps every 75sec x 6 sets\n\n*treat this like an EMOM clock -- i use the app \"4Time\" to do 90sec intervals for me.\n*FILM FROM BACK/SIDE ANGLE PLEASE","31X1; 4-6reps x 2 sets\n+\n30X0; 8-12reps x 2 sets\n- rest 2min between each set - \n\n*the first two sets i want you to honor your pauses and really focus on quality movement and tempo. the second two sets without pauses, but more reps you *should* be able to keep a similar load.\n*FILM ONE SET OF EACH to see tempo","31X1; 8-10reps; rest 30sec between arms; rest 60sec","5sec hold + 8-10reps/arm; rest 60sec x 3 sets\n\n*Squeeze the LOWEST part of your lats here","Tabata (4-6min total):\n20sec Adduction Bias SL RDL LEFT\n10sec Rest\n20sec Adduction Bias SL RDL RIGHT\n10sec Rest\n20sec Wall Deadbug\n10sec Rest\nx 3-4 sets\n\n*If needed, add an extra 30-60sec rest between sets to keep mind-muscle connection and movement quality the highest possible.\n*Start very light in week 0-1","800m Run @ EASY PACE\n- 200m Walk - \n800m Run @ RPE 6/10 PACE\n- 200m Walk - \n\n+\n\n3-5 sets:\n400m Run @ Increasing RPE to 9/10\nThis week, start with RPE 7/10 for first interval, and slighlty increase pace to an RPE 9/10 on the first set. Alternatively, if you are feeling more tight today, start at RPE 7/10 and build to 9/10 on your last set.\n+\n\nWalk 5-10mins\n\n*DO NOT FORGET TO DO YOUR COOL DOWN BEFORE FINISHING.","LOGGING\nDaily - log breakfast and lunch\nWeekly - log dinner 2x/wk","STEPS\ndaily - check step count before 12pm (with goal of bringing awareness getting 10k per day)\nWeekly - one dedicated walk 2x/wk (treadmill or outside)","ALCOHOL\ndaily - making a conscious post-work beverage decision\nWeekly - one social activity per week (not drinking drag brunch, NA beer at a brewery, mocktail for Galentines day, Olympics party for next weekend) OR journaling about social anxiety you feel while out","Please reflect how you did with your habit tracker and these goals - if less than 10/10, share why and what you'll focus on for next week to make it happen! (and remember, you tend to be harder on yourself than most \u25e1\u0308 )","Please submit in Progress Photos section of TC\n\n*You must do this Monday or Tuesday AM before work in the same lighting and similar outfit.","Great work last week with the changes in rep scheme and movements.\n\nHere is the plan for the next few weeks:\nhttps://www.loom.com/share/bd789d14e3a24ee0bef3ee9f3c0dcadf\n\nThis week, your goal is to progressively overload...\n\nYou have the option to manipulate the:\n*TEMPO (adding more squeeze in each rep or slowing the eccentric to load the tissues more), \n*REPS (if you were at the lower end last week, do more reps at that weight this week) or \n*LOAD (conversely, if you were on the higher end, see if you can bump up load!).\n*SETS (if you noticed your first working set was not an optimal effort, consider that first set a warm up and do another set at the target RPE for the day).\n\nLAST HARD WEEK BEFORE TESTING!","800m Run @ EASY PACE\n- 200m Walk - \n800m Run @ RPE 6/10 PACE\n- 200m Walk - \n\n+\n\n3-5 sets:\n400m Run @ Increasing RPE to 9/10\nThis week, start with RPE 7/10 for first interval, and slighlty increase pace to an RPE 9/10 on the first set. Alternatively, if you are feeling more tight today, start at RPE 7/10 and build to 9/10 on your last set.\n+\n\nWalk 5-10mins\n\n*DO NOT FORGET TO DO YOUR COOL DOWN BEFORE FINISHING.\n\n*Next build we will add in fatigued running","Welcoime BACK to testing week! Let's see how your hard work OF STAYING SO CONSISTENT with your training while recovering from your back injury and surgery has paid off. I want the vibe of this week to be FUNNNN. Blast your Rainbow Kitten Surprise or whatever pumps you up in your headphones and hit it!\n\nLet's just stay curious about what is POSSIBLE! Keep your core braced as your main focus and only going to your SAFEST edge.\nMost of these movements are probably going to be your primary movements in your new build, so by testing them, we ser ourselves up for suceess in week 1 by knowing what loads are your max so we can estimate what training loads need to be.\n\nNOTES FOR TESTING WEEK!\n\nPlease be cognizant of all tempo Rx's and filming angles. \nSend all training videos IN TRUECOACH in the workout so we can refer back to testing videos.\nPlease trim all videos before uploading to show only the movement being performed. \nPlease enter results into the metrics section of your workout to anticipate loading set up (see below)\n\n1. How to structure a build up to max effort:\nWarm Up Sets 1-2\nBuilding Sets 3-4\nMax Effort Attempts Sets 5-6\n*Warm up sets are light and maybe higher rep to get the blood flow\n*Building sets might be only a few reps to conserve energy (i.e., do not have to do 6 reps)\n*Max Effort Attempts are the ones you perform for 6 reps\n\n2. Recording Results and Training Intensity\nFor each movement, i want you recording:\n* the number of reps completed,\n* the weight you used\n* and RPE (rate of perceived exertion) 1-10 for EACH SET. \n\nThis helps me ensure you are progressively overloading each week and will provide you with information to refer back to back to week. You can use the \"Exercise History\" function each week to see what loads you lifted the previous week so you can either increase load or reps or improve execution (same load + reps but lower RPE).\n****Results Example:\nSet 1: 75lbs x 8 reps - RPE 6\nSet 2: 85lbs x 6 reps - RPE 7.5\nSet 3: 95lbs x 6 reps - RPE 9\n\n*RPE 9 means you could have done 1 more rep at tempo before losing form or structural integrity, RPE 8 means 2 reps left in reserve, etc.\n*All training efforts should be between 7-9 and testing efforts are between 9-10.\n\nLET'S HAVE SOME FUN THIS WEEK!!!\nYours in health,\nCoach Bri","film- 20X2; build to 8RM/leg; rest 30sec between sides","3111; build to a moderately tough set of 3.\n\n**FOCUS: The range of motion is hip crease just below the knee; keeping core TIGHT and not letting elbows drop when coming out of the hole\n*BELT IS ENCOURAGED for tactile feedback of bracing INTO the belt!!\n*Option to use a smith machine instead of BB for extra external stability to facilitate a higher load without as much worry for back\n*Rest as needed between sets and try to hit your top set in no more than 5-6 total sets\n\n*FILM EVERY SET FROM THE SIDE PLEASE","Build to a 1RM @ 30X1\n+\nRest 90sec after last successful attempt and perform ONE MIN AMRAP bodyweight set @ PFQ Test standards*\n\n*bonus point for each rep over 20reps","2min AMRAP with 20lb weight vest or 20lb DB in goblet*\n\n*bonus point for each rep over 75reps\n**Theraband is very light - just enough for you to remember to keep both glutes and hip flexors engaged and not quad dominate","Tabata\n20sec max reps\n10sec rest\nx 8\n\n*MUST KEEP BACK PRESSED INTO PAD WHOLE TIME, use arms to swing forward - aim for 10+ reps per set","*SEND THESE RESPONSES IN MESSAGES AFTER EACH SESSION*\n1. What were your noticing(s) from today's training session?\n2. What was your fueling strategy prior to today's training session? Would you do anything differently next time?\n3. Was there anything in today's session that you experienced for the first time? If so, what?\n4. Was there anything in today's session that you were unable to complete? If so, why do you believe this was the case?","5mins Cardio your choice\n+\n2-3 Rounds \n1. Runner Lunge Thoracic Rotation x 10/side \n2. Low Cossack Transition x 5/side \n3. Quadruped Scapular Push Ups x 10-15reps","This is my favorite aerobic flow right now, and is optional for you, but best done on days you feel tired, sore, or burnt out. Pop those airpods in and just get in touch with your body.\n\n12sets:\n45sec Ski/Row/Bike/Run\n45sec Active Mobility*\n\n*Peform 45sec of each movement - in the specified order or the order of your choosing!\n1. Hip Airplates LEFT\n2. Hip Airplanes RIGHT\n3. 10 Pelvic Tilts + Supine Leg Lowering remaining\n4. Half Kneeling KB Windmill LEFT\n5. Half Kneeling KB Windmill RIGHT\n6. Prone Snow Angels\n- then repeat or add your own favorite mobility moves -","AMRAP Hold per side; rest 45sec between sides\n\n*bottom knee is squeezed to the bench as well","30X0; Build to a 3RM; rest 90sec after last attempt\n\n3min MAX BURPEES\n*bonus point for each rep over 50reps\n\n- then rest until full recovery before building to Knee Extension -","film- 20X2; build to 8RM/leg; rest 30sec between sides\n\n*keep core braced to prepare for deadlifts","3111; build to an 8RM. range of motion is just below the knee; rest as needed between sets and try to hit your top set in no more than 5-6 total sets\n\n*You have the option to test RDL 8RM instead of deadlift - choose option based on desired result for PFQ and for your training coming up","build to 6RM/arm","*SEND THESE RESPONSES IN MESSAGES AFTER EACH SESSION*\n\n1. What were your noticing(s) from today's training session?\n2. What was your fueling strategy prior to today's training session? Would you do anything differently next time?\n3. Was there anything in today's session that you experienced for the first time? If so, what?\n4. Was there anything in today's session that you were unable to complete? If so, why do you believe this was the case?","AMRAP Hold - film","8sets:\n30sec Bike/Row/Stairs @ 8/10 RPE\n30sec Bike Easy Spin/Rest\n+\nrest 2min\n+\n8min Continuous\n20m Marching Farmer Carry - Moderate load, great posture\n12 Half Kneeling DB Windmills, 6/side\n12 Plank DB Rows, 6/side\n12 Straight Leg Sit Ups with slow eccentric\n+\nrest 2min\n+\n8sets:\n30sec Bike/Row/Stairs @ 8/10 RPE\n30sec Bike Easy Spin/Rest\n\n*For the 8min AMRAP: I want you to move at a pace that feels challenging (in terms of load and position challenge) but you are able to hold a broken sentences conversation. If you have more time and are feeling good -- you are welcome to extend the segment to 10 or 12 mins. Just turn your headphones on and flow. If you are not able to sled push, I suggest doing 10-15 Reverse Plank Hip lifts","1 Round Banded Hip Mobility:\n1min Banded Hip Distraction/side\n1min Banded Samson/Couch Stretch/side","WELCOME TO WEEK 0 \u2014 YOUR TRANSITION + NEW BUILD WEEK\n\nStarting a new program can feel uncomfortable. New movements, new structure, and that little voice asking, \u201cAm I doing this right?\u201d\n\nThat\u2019s exactly why Week 0 exists.\n\nThis week is not about proving anything. It\u2019s about learning the movements, finding your positions, and building confidence in how this program feels in your body. Think of it as laying the foundation so we can progress faster and more intentionally later.\n\nEFFORT\nTarget RPE: 7\u20138/10\nYou should feel like you\u2019re working and focused, breathing a bit harder, but still moving with control. You should finish most sets knowing you could do a few more reps if needed.\n**Leave about 3 reps in reserve before absolute failure and 1\u20132 reps before form failure.\nRPE = rate of perceived exertion on a 1\u201310 scale.\nRIR = reps in reserve, or how many reps you had left in the tank.\n\nEXECUTION\nPrioritize form, tempo, and mind\u2013muscle connection over load. If something feels awkward or unfamiliar, that\u2019s expected. If a weight feels too light or too heavy, adjust. This week is about exploration, not perfection.\n\nDATA TRACKING\nLog your weights, reps, and RPE honestly. This data guides everything we do next.\nRecord your sets like this:\nSet 1: 10 reps @ 30 lbs \u2013 RPE 7 (3 RIR)\n**We will reference these results in the coming weeks to progress you appropriately.\nFor rep-based sets:\n-- If you started too light, add reps until you reach the target RPE.\n-- If you started too heavy, do as many reps as you can with good form, rest briefly, then complete 1\u20132 more reps to get closer to the target effort.\n\nFILMING\nFilming matters, especially in these first weeks.\nFilm at least one set from the side and upload it in the workout. Ideally, film your first and last sets. Watching your first set during rest can help you self-correct, and the last set shows where effort or form may shift.\nThis helps me coach you more precisely and ensures you\u2019re progressing safely and effectively.\nIf you have questions or something doesn\u2019t feel right, reach out. That\u2019s what I\u2019m here for.\n\nYou\u2019re exactly where you need to be. Let\u2019s build from here.\n\n\u2014 Coach Bri \ud83d\udcaa","2-3 sets\nSingle Leg Prone Hamstring Curl x 15/leg*\n- rest as needed - \nSupine Leg Lowers with Hip Lift x 20reps**\n- rest as needed between sets -\n\n*ensure you are hollow in the core while doing these to not crunch lumbar\n**I want you squeezing out as much core engagement as you can each rep\n***Rest as needed between movements and sets to keep mind-muscle connection and movement quality the highest possible.","31X1; 8,6,6,4reps; rest 90sec-2min x 4 sets\n\n*After each set, perform 10 Hip Airplanes/side","10X3; 8-12reps/leg; rest 2min x 4 sets\n\n*Squeeze glutes HARD at the top each rep, only put 20-30% weight in kickstand leg\n*Think about bracing the 2\" below your belly button HARD and scooping the pubic bone UP and into the pad vs arching the back to get to the top.","20X1; 10-15reps/arm; rest 60-90sec x 3 sets\n\n*Biasing MOSTLY LAT here - the elbow should only travel 0-1\" past the body, not further or we will get some upper trap engagement that we don't want! \n*Use straps!","10-15reps/arm; rest 30sec between arms; rest 60-90sec\n\n*At the top of each rep, actively press UP against the DB. Watch yourself in the mirror to ensure you are keeping shoulders stable and \"proud chest\" entire time.\n*Sit on a plate or pad if hamstrings feel too tight to comfortably sit upright","40sec Max Rep Strict Pull Up\n75sec Rest\n30sec Max Rep Strict Pull Up\n60sec Rest\n20sec Max Rep Strict Pull Up\n\n*Start each set with am AMRAP-2 set, then chip away remaining time.\n*We are doing this at the end to practice for doing this dampened","Tabata\n20sec Max reps\n10sec Rest\nx 8 sets\n\n*choose a weight that would be tough to get 20reps and keep that the whole time","Warmup  (8 mins) \n\n5min Cardio Your Choice \n+\n2 sets\n1) 30sec Passive Hang\n2) 6-8 DB or KB Windmill/side @ 2020\n3) 8-10 DB External Rotations/side @ 2020","8sets:\n30sec Ski/Bike/Run/Row @ 8/10 RPE\n30sec Bike Easy Spin\n+\nrest 2min\n+\n8min Continuous\n20m Marching Farmer Carry - Moderate load, great posture\n12 Dynamic Adductor Stretches/side\n12 Reverse Plank Bridge Hip LIft\n20m Marching Farmer Carry - Moderate load, great posture\n12 Half Kneeling DB Windmills, 6/side\n12 Hollow Rocks\n+\nrest 2min\n+\n8sets:\n30sec Ski/Bike/Run/Row @ 8/10 RPE\n30sec Bike Easy Spin\n\n*For the 8min AMRAP: I want you to move at a pace that feels challenging (in terms of load and position challenge) but you are able to hold a broken sentences conversation. If you have more time and are feeling good -- you are welcome to extend the segment to 10 or 12 mins. Just turn your headphones on and flow.","2-3 sets:\n10-20 Hanging Knee Raises @ 2121\nor 10-12/leg Hip LIft Weight Plate Psoas March\n- rest as needed -\n10-20 Split Stance Pallof Press/side*\n- rest as needed between sets -\n\n*Use a band or cable to perform these for the anti-rotation stimulus we need to strengthen the obliques and protect the spine!\n**Rest as needed between movements and sets to keep mind-muscle connection and movement quality the highest possible.","30X1; 3reps every 60sec x 6 sets","31X1; 6-10reps; rest 2min x 4 sets\n\n*After each set, perform 10 Single Leg Deficit Calf Raises/leg\n\n*I want to see ZERO CHANGE to your posture after coming out of the 1sec pause. The goal is for you to use POWER to come out of the deadstop - same as RDLs below!","4-6 reps every 2min x 5 sets\n\n*Pause 2sec with the bar about 2\" from the floor each rep - this Rx'd to teach you to effectively wedge and gain confidence pulling and sustaining position after pulling off the floor","60sec AMRAP\n60sec rest \nx 2 sets \n\n*You must remain strict on the push up - let your core stability be your control for this segment. If you notice your core breaking, recommit and slow down. This is more about core-to-extremity endurance than true burpee endurance - yet!","20X2; 10-12reps/side; rest 45sec x 3 sets\n\n*Notice the tempo - squeeze the bench hard for 2sec each rep and then feel that stretch as you lower","5-8reps/leg rest 30sec between legs; rest as needed x 3 sets\n\n*Use the bench, and lower as slow as you can - focusing on biasing the working leg as much as you can without bounding off non-working leg. ensure core is braced so hips don't drop!","BONUS if you have energy:\n20X2; 15-20reps squeezing core as much as you can.","Warmup  (8 mins) \n\n3-5 min Cardio of Choice\n+\n2-3 Sets\n1) 10 Quadruped Hip CARs/side\n2) 10 Bird-Dog/side\n3) 10 Squat Plus Thoracic Rotation/side (use leverage with the non-working hand to reach up)","2-3 sets\n10 Single Leg Medball Slam - RIGHT\n30sec Bent/Hollow Body Hold**\n10 Single Leg Medball Slam - LEFT\n30sec Pelvic Tilt into Glute Bridge (+ squeeze!)\n- rest as needed between sets -\n \n**Think about squeezing the 2\" below your belly button and pressing your lumbar spine into the floor AS HARD AS YOU CAN - really exaggurate it!\n***Rest as needed between movements and sets to keep mind-muscle connection and movement quality the highest possible.","15reps/leg; rest 30sec between sides; rest 60-90sec x 3 sets\n\n*Squeeze hamstrings for one sec each rep \n*Push yourself into the seat HARD using the handles","10X2; 10,8,6,10reps; rest 2min\n\n*Wave load - aim to increase load on second set to the first\n*Let your core and glute engagement be your \"control\" here","31X1; 3-5reps every 90sec x 5 sets","2121; 6-10reps/leg; rest 90sec-2min x 4 sets","21X1; 12-15reps; rest 60sec x 3 sets\n\n*Volume and grip endurance focus","75sec Max Reps; rest 60sec x 3 sets\n\n*dampened from RFESS","10 quality, controlled reps x 1-2 sets","10-15reps/side x 1-2 sets\n\n*focus on stretch, keep lower core braced and standing leg with a micro-bend\n*volume focus","15-20reps/side x 1-2 sets\n\n*volume focus","1200m Run @ EASY PACE\n- 200m Walk - \n800m Run @ RPE 6-7/10 PACE\n- 200m Walk - \n\n+\n\n3-5 sets:\n800m Run @ Increasing RPE to 8.5/10\n2min Brisk Recovery Walk\n+\n\nWalk 5-10mins cool down\n\n*DO NOT FORGET TO DO YOUR COOL DOWN BEFORE FINISHING.","Welcome to week 1 of your new training build!\n\nThis week, and the weeks to come:\nReps and sets stay the same - the intensity is what changes.\n\nGOAL stays the same - only loading as heavy as you can maintain mind-muscle connection and empasis on the quality of tempo and positions.\n\nThis week, your target RPE is 8\u20139/10 (up from 7). That means your working weight should challenge you about one rep before failure.\n\nHow to dial it in:\nTake 1\u20132 warm-up sets to build to your working weight.\nOn your first working set, push close to failure to test the load.\nIf you could\u2019ve done 1\u20132 more reps, you nailed it. & keep that weight for the remaining sets.\n\nIf you had 3+ reps left, bump the weight up and treat the next set as your true first working set.\n\nQuick adjustments (no overthinking):\n\nToo light?\nTreat it as a warm-up or push the set until you hit the right RPE, then adjust the weight for the next set. Nothing is wasted if you\u2019re learning.\n\nToo heavy?\nGet as many clean reps as you can without grinding, rest briefly, then add 1\u20132 more quality reps if form stays locked in.\n\nLet's GET STRONG!!!!\nCoach Bri","31X1; 6-10reps; rest 2min x 4 sets\n\n*After each set, perform 10 Split Stance Calf Raises/leg\n\n*I want to see ZERO CHANGE to your posture after coming out of the 1sec pause. The goal is for you to use POWER to come out of the deadstop - same as RDLs below!","Welcome to week 2 of your new training build!\n\nThis week, and the weeks to come:\nReps and sets stay the same - the intensity is what changes.\n\nGOAL stays the same - only loading as heavy as you can maintain mind-muscle connection and empasis on the quality of tempo and positions.\n\nThis week, your target RPE is 8\u20139/10 (up from 7). That means your working weight should challenge you about one rep before failure.\n\nHow to dial it in:\nTake 1\u20132 warm-up sets to build to your working weight.\nOn your first working set, push close to failure to test the load.\nIf you could\u2019ve done 1\u20132 more reps, you nailed it. & keep that weight for the remaining sets.\n\nIf you had 3+ reps left, bump the weight up and treat the next set as your true first working set.\n\nQuick adjustments (no overthinking):\n\nToo light?\nTreat it as a warm-up or push the set until you hit the right RPE, then adjust the weight for the next set. Nothing is wasted if you\u2019re learning.\n\nToo heavy?\nGet as many clean reps as you can without grinding, rest briefly, then add 1\u20132 more quality reps if form stays locked in.\n\nLet's GET STRONG!!!!\nCoach Bri","4-6 reps every 2min x 5 sets\n\n*Pause 2sec with the bar about 2\" from the floor each rep - this Rx'd to teach you to effectively wedge and gain confidence pulling and sustaining position after pulling off the floor\n   \n6@45\n6@95\n-\n6@111/7\n6@121/7\n6@131/7.5\n6@131/7.5\n6@136/7.5","Welcome to week 3 \ud83d\udd25\n\nThis is the last time you will see these reps before we drop the reps and increase load next week.\n\nThis week is about finding your loading edge with the best mind\u2013muscle connection and positions you can own, especially on the last set of each movement. \n\nLet's reflect on mindset over the last 3 weeks to honor the effort you have put in thus far, and set yourself up for success in the weeks to come. Please take just 5mins to reflect on these 3 questions and send me a message with your responses!\n\n1. What would Past Me be genuinely proud of?\n2. What tiny habits or small decisions quietly compounded into real progress?\n3. What did I stay consistent with, even during chaos or transition?\n\nLet's keep this train rollin'!\nCoach Bri","Welcome to week 0!\nBUT this is really a welcome to a new season of YOU. This is the season of your training where we ultra-emphasize mind-muscle connection over trying to max out your loading each week. This cycle is designed to build your CAPACITY of mind-muscle connection to the work you are doing. By taking a cycle to refocus on form and the engagement we are getting from each rep helps us recover better, get quicker adaptation (wake up, hamstring and glute!!).\n\nI am SO FIRED UP to share this program I wrote based off our work together, and because you are my DREAMMMM ideal client. You'll notice I made some changes for you specifically compared to the loom (ie: you're getting weighted pull ups versus building one rep at a time, and with adding deadlifts in instead of hip thrusting twice per week).\n\nHere is the breakdown of our new Athletic Bodybuilding build! \nhttps://www.loom.com/share/5a9d2454682942a082844dd2e80542c3\n\nPlease look through each workout and let me know what you think!!\n\nLove you!","2-4 Rounds:\n30sec Single Arm KB Rack High Knee March LEFT\n10 Half Kneeling KB Windmill LEFT\n20 KB Deadbug\n30sec Single Arm KB Rack High Knee March RIGHT\n10 Half Kneeling KB Windmill RIGHT\n20 KB Deadbug\n\n-rest as needed-","Absolute Strength: Weighted Pronated Pull Up\n1 rep every 75-90sec x 3-5 sets\n+\nPull Up Negative from Box*\n10 sets: 1 rep lowering as controlled as possible\n\n*Hypertrophy/strength focus","2221; 4-6reps; rest 90sec-2min x 2 sets\n+\n21X1; 8-10reps; rest 90sec-2min x 2 sets\n\n*Volume/Mind-Muscle Connection focus","20X1; 6-10reps; rest 30sec between sides; rest 75sec x 3\n\n*As you pull, lean over slightly into the lat to engage the full body of the lat, all the way down to the hop\n\n*Hypertrophy/strength focus","16-20 alternating reps; rest 75sec x 3 sets\n\n*Stay actively pushing up in the top position of the DB press\n\n*Volume/Mind-Muscle Connection focus","30X1; 10-12reps; rest 60sec x 3 sets\n\n*Hypertrophy/strength focus","2-3 sets:\n15 Lean Away DB Lateral Raise LEFT\n10 DB Skull Crushers\n15 Lean Away DB Lateral Raise RIGHT\n10 DB Skull Crushers\n30sec Front Leaning Rest\n- rest as needed -","5-10mins Cardio Your Choice to get body temp up","8sets:\n30sec Ski/Bike/Run/Row @ 8/10 RPE\n30sec Bike Easy Spin\n+\nrest 2min\n+\n8-12min Continuous\n15m Crossbody Farmer March LEFT\n10 Half Kneeling KB Windmill LEFT\n5 Quadruped Hip CARs LEFT\n10 Prone Snow Angels with Scapular Retraction\n15m Crossbody Farmer March RIGHT\n10 Half Kneeling KB Windmill RIGHT\n5 Quadruped Hip CARs RIGHT\n+\nrest 2min\n+\n8sets:\n30sec Ski/Bike/Run/Row @ 8/10 RPE\n30sec Bike Easy Spin\n\n*For the 8min AMRAP: I want you to move at a pace that feels challenging (in terms of load and position challenge) but you are able to hold a broken sentences conversation. If you have more time and are feeling good -- you are welcome to extend the segment to 10 or 12 mins. Just turn your headphones on and flow.","3 sets:\n12 Medball Slams - HARD\n12 Switch Lunges with Medball in Bearhug, 6/leg\n12 Hanging Knee Raises with pause per rep\nrest 60sec","31X1; 6-8reps/leg; rest 90sec x 3 sets\n\n*Hypertrophy/strength focus","10X2; 8-12reps; rest 90sec-2min x 2 sets\n+\n20X1; 8-10reps + rest 20sec + Myo Set; rest 90sec-2min x 2 sets\n\n*After each set of Hip Thrusts, perform 10 Calf Raises with 2 sec squeeze at the top of each rep\n\n*Hypertrophy/strength focus","21X1; 6-10reps; rest 90sec-2min x 4 sets\n\n*Hypertrophy/strength focus","20X1; 10-15reps; rest 90sec x 3 sets\n\n*Volume/Mind-Muscle Connection focus","31X0; AMRAP-1; rest 2min x 4 sets\n\n*On your last set of push ups, perform a Myo Set. Perform your AMRAP-1 set, and then rest 10sec and perform as many more as you can at that perfect tempo\n\n*Volume/Mind-Muscle Connection focus","EMOM x 8\nodd - 40sec KB Psoas March\neven- 20sec Single Arm Farmer Walk - HEAVY AF","This is my favorite aerobic flow right now, and is optional for you, but best done on days you feel tired, sore, or burnt out. Pop those airpods in and just get in touch with your body.\n\n12sets:\n45sec Ski/Row/Bike/Run\n45sec Active Mobility*\n\n*Peform 45sec of each movement - in the specified order or the order of your choosing!\n1. Hip Airplates LEFT\n2. Hip Airplanes RIGHT\n3. 90/90 Internal Rotation LIft Offs LEFT\n4. 90/90 Internal Rotation LIft Offs RIGHT\n5. Hollow Body KB Pull Over\n6. Quadruped KB Pull Through\n- then repeat or add your own favorite mobility moves -","3 sets:\n15 DB External Rotations/side\n10 Plyo Bench Push Ups\n20 Rear Delt Fly (same load as DB ERs)\n- rest as needed -","Volume Build: Foot Banded Pull Up\n5 reps every 75-60sec x 5-7 sets*\n\n*Choose a band set up that allows you to get a very TOUGH set of 5 in your first set. Then, once you have found that for your first set, the next 4-6 sets will be a slightly less challenging set up (raise the band and hooks up by 1-2 notches) for the remainder of the sets.\n\n*Volume/Mind-Muscle Connection focus","30X1; 6,6,5,5reps; rest 75sec\n\n*Hypertrophy/strength focus","3131; 6-8reps/side; rest 45sec between sides; rest 75sec x 3*\n\n*Call it after your 4th set of bench -- only 3 sets here.\n*Volume/Mind-Muscle Connection focus","30X1; 6-8reps/leg; rest 45sec between sides; rest 60sec x 3 sets\n\n*Hypertrophy/strength focus","21X0; 16-20 alternating reps; rest 60sec x 3 sets\n\n*Volume/Mind-Muscle Connection focus","For Quality:\n30 Kneeling Cable Crunches\n30 Beast to Front Step, 15/side\n20 Kneeling Cable Crunches\n20 Beast to Front Step, 10/side\n10 Kneeling Cable Crunches\n10 Beast to Front Step, 5/side\n\n*For both movements, pause for one sec at the end of each rep with the intention of squeezing out as much engagement as you can from each rep.\n*As the reps go down, increase the load on the Cable Crunches, and increase your mind-muscle connection to your obliques\n*Beast to Front Step - pretend you are on rice paper, so you are moving deliberately and mindfully with the hands and feet, as to not rip the rice paper each rep.\n*If you are not able to snag a cable, perform Kneeling Banded Crunch.","Cooldown\n\n1. Barbell Shoulder Extension Stretch x 30 sec\n2. Single Arm Wall Prayer Stretch x 30 sec/side\n3. Supinated Passive Hang x 30 sec\n+\n5min Static Back","Heel Sit x 1 min\nFrog Stretch x 1min\nQuadruped Hip CARs x 5/side/direction\nReclining Hero Pose x 1-2 min\nWorlds Greatest Stretch x 1 min/side\nFront Split Progression x 1 min/side\nBottom of Squat Hold x 1 min \nAssisted Cossack Squat x 10/side\n\n*Perform this ONCE. If you have a little extra time/oomph, repeat 1-2 of the movements that feel the tightest for you today.","5-10mins of breathwork on Apnea trainer or leave your phone at home and revel in the 5-10mins of time with yourself.","Welcome to week 1 your new build!! Now that you have stress tested all the movements and have a better sense of the flow for each workout, we can anticipate you will be able to hit the ground runing this week!\n\nRPE is your MAIN FOCUS this week of the new build:\n\nRPE Target - 8/10\n*Leave about ~2-3 reps in the tank before ABSOLUTE failure\n*Leave about 1-2 reps in the tank before FORM failure\n\nYou may still be finding the right weights and level of Mind-Muscle Connection needed to elicit the right RPE target.\nI also know you don't have 100 hours to \"princess and the pea\" your load with a bunch of sets.\nSo, here is what I do:\n\nI do my best to estimate what I can do, then if I....\nStarted too light? \n\u2192 Add reps until you hit your target RPE.\n\nStarted too heavy? \n\u2192 Do as many reps as you can at that weight, take a short rest, then squeeze out 1\u20132 more to get closer to your goal.\n\nLET'S GET STRONG FOR SUMMER!!\nCoach Bri","30X1; 10-12reps; rest 60sec x 3 sets\n\n*Hypertrophy/strength focus\n   \n12@20R\n12@30L\n\n10@20R\n10@35L\n\n\u201c\n\u201c","Welcome to week 3!\nThis week, your reps are down a bit on the absolute strength work - really aim to push the effort by emphasizing the squeeze at the end of each rep. \n\nThen, in the weeks to come, we can better prioritize LOADING over MMC.\n\nThis is the week where things really start to CLICK. Give yourself the best opportunity to feel that mind-muscle connection by filming your first set on any movement you don't feel 10000% confident with.\n\nLet's get it this week!\n\nBri","2-4 Rounds:\n30sec KB Knee Flexion LEFT*\n10 Half Kneeling KB Windmill LEFT\n10 Switch Lunges\n30sec KB Knee Flexion RIGHT\n10 Half Kneeling KB Windmill RIGHT\n10 Switch Lunges\n\n-rest as needed-\n\n*Really lift UP from the hip flexors and lower core (2\" below belly button) -- use assistance from something sturdy if you are struggling with balance OVER engagement focus","Absolute Strength: Weighted Pronated Pull Up\n1-2 rep every 75-90sec x 3-5 sets\n+\nPull Up Negative from Box*\n6-10 sets: 1 rep lowering as controlled as possible\n\n*Hypertrophy/strength focus\n*If you do more \"work\" on your strict reps, use the negatives as a burnout to put a stamp on those reps -- not to burn you out.","2221; 3-5reps; rest 90sec-2min x 2 sets\n+\n21X1; 6-10reps; rest 90sec-2min x 2 sets\n\n*Volume/Mind-Muscle Connection focus","20X1; 6-9reps; rest 30sec between sides; rest 75sec x 4\n\n*As you pull, lean over slightly into the lat to engage the full body of the lat, all the way down to the hop\n\n*Hypertrophy/strength focus","16-20 alternating reps; rest 75sec x 4 sets\n\n*Stay actively pushing up in the top position of the DB press\n\n*Volume/Mind-Muscle Connection focus","30X1; 8.8reps; rest 60sec x 3 sets\n\n*Rest 15sec between clusters for a total of 16 reps per set\n*Hypertrophy/strength focus","2-3 sets:\n20 Lean Away DB Lateral Raise LEFT\n15 DB Skull Crushers\n20 Lean Away DB Lateral Raise RIGHT\n15 DB Skull Crushers\n40sec Front Leaning Rest\n- rest as needed -\n\n*reps are UP - aim to keep same load for more reps","3 sets:\n12 Lateral Medball Slams - HARD, 10-14lbs\n12 Half Kneeling Contralateral Medball Chop LEFT\n12 Hollow Body Pull Over*\n12 Half Kneeling Contralateral Medball Chop RIGHT\nrest 60sec\n\n*Pull over with medball or hollow rocks if shoulders are toasty from the medball work.\n*Take your time on this warm up so you can focus on expressing POWER","31X1; 6-8reps/leg; rest 90sec x 3-4 sets\n\n*Hypertrophy/strength focus\n\n*Adding an optional 4th set -- you can perform this bodyweight OR you can go for it with another loaded/working set. The goal is VOLUME (in pain-free ranges) here to build you for running goals (and progressive overload ofc)","10X2; 6-10reps; rest 90sec-2min x 2 sets\n+\n20X1; 6-10reps + rest 20sec + Myo Set; rest 90sec-2min x 2 sets\n\n*After each set of Hip Thrusts, perform 10 Calf Raises with 2 sec squeeze at the top of each rep\n\n*Hypertrophy/strength focus","21X1; 6,8,8,8reps; rest 90sec-2min x 4 sets\n\n*Hypertrophy/strength focus\n*build to a (reasonably) tough set of 6, then strip about 5-10% of the load to sustain a RPE of 8-9 in your sets of 8","20X1; 10-15reps; rest 90sec x 3 sets\n\n*Volume/Mind-Muscle Connection focus\n*keeping reps high, keep focusing on keeping your chest PROUD as you pull the elbows back. elbows ONLY go as far as they are in-line with the torso, not more.","21X0; AMRAP-1 + Myo set; rest 2min x 4 sets\n\n*Notice change in tempo - a bit faster this week - let's see what reps we can accumulate!\n\n*Volume/Mind-Muscle Connection focus","EMOM x 8\nodd - 40sec Plank Psoas March*\neven- 40sec Goblet Lateral Band - HEAVY AF\n\n*Really drive that knee forward hard, then pause to work against the recoil by bracing the core.","3 sets:\n10 Plyo Bench Push Ups*\n- rest as needed -\n15 Banded Cuban Press\n10 Supinated Band Pull Apart\n- rest as needed -\n\n*This week, we are upping the ante on the push ups. I want you to push yourself away from the bench as FAR as you can, then land right back into a perfecttttt plank before starting your next rep. Keep your core tight so you can focus on \"loading the coil/spring\" of the shoulders to push away hard from a very stable platform.","Volume Build: Foot Banded Pull Up\n4-5 reps every 75-60sec x 5-7 sets*\n\n*Choose a band set up that allows you to get a very TOUGH set of 5 in your first set. Then, once you have found that for your first set, the next 4-6 sets will be a slightly less challenging set up (raise the band and hooks up by 1-2 notches) for the remainder of the sets.\n\n*Volume/Mind-Muscle Connection focus","30X1; 4,4,6,8,10reps; rest 75sec\n\n*Hypertrophy/strength focus\n*Go for a TOUGH set of 4, then repeat for another set of 4. Then start adding a little weight to focus more on VOLUME (and reconnect to quality of movement) as the reps go up.","For Quality:\n30-25-20-15-10\nKneeling Cable Crunches\n*90/90 Thread The Needle x 6-8/side between each round (only 4 sets per side of this)","Welcome to week 4!\nLast week, we made a handful of programming changes. This week, I want you to use what you learned in the last week to set yourself up for success in your load selection and mind-muscle conneciton.\n\nYour goal the next few weeks is to progressively overload.\n\nYou have the option to manipulate the:\n\ud83c\udfafTEMPO (adding more squeeze in each rep or slowing the eccentric to load the tissues more), \n\ud83c\udfafREPS (if you were at the lower end last week, do more reps at that weight this week) or \n\ud83c\udfafLOAD (conversely, if you were on the higher end, see if you can bump up load!).\n\ud83c\udfafSETS (if you noticed your first working set was not an optimal effort, consider that first set a warm up and do another set at the target RPE for the day).\n\nBri","Welcome to week 5!\n\nThis week, we\u2019re keeping reps the same. Your goal is to explore progressive overload through smarter, more intentional movement. Think MMC (mind-muscle connection), TUT (time under tension), ROM (range of motion), and RPE (rate of perceived exertion).\n\nYour goal the next few weeks is to progressively overload.\n\nYou have the option to manipulate the:\n\ud83c\udfafTEMPO (adding more squeeze in each rep or slowing the eccentric to load the tissues more), \n\ud83c\udfafREPS (if you were at the lower end last week, do more reps at that weight this week) or \n\ud83c\udfafLOAD (conversely, if you were on the higher end, see if you can bump up load!).\n\ud83c\udfafSETS (if you noticed your first working set was not an optimal effort, consider that first set a warm up and do another set at the target RPE for the day).\n\nBri","This week, we are going to uppppp the ante a bit.\n\nYou'll see a handful of changes to your training this week. I want us using these next 3 weeks to really LOCK IN to your absolute strength and your hypertrophy focuses. The biggest focus for the next 2-3 weeks is: Mind muscle connection. \nI want you thinking to yourself each set, \"How much muscle tension can i put on THIS muscle right here.\" and really focus your effort there. This is a big unlock as we get RAMP UP your strength.\n\nThe more CONFIDENCE you can get from how your body feels with these lifts, the more room for absolute strength we can create when it's time to test.\n\nWe know that hypertrophy determines the contour of your body, but walking and managing energy balance (cals in and cals out), is what achieves true Body Recomposition. Let's make sure we are using walking for mental health JUST as much as physical health.\n\nTLDR: your big goals this week are to match your RPE from last week with the added tempo and rep change stimulus, ensure you are hitting your protein + creatine every day, and getting your steps in.","2-3 Rounds:\n6 Half Kneeling DB WIndmill Press LEFT\n8 Dynamic Adductor Stretch LEFT\n10 Deadstop Russian Twists/side\n8 Dynamic Adductor Stretch RIGHT\n6 Half Kneeling DB WIndmill Press RIGHT\n10 Glute Bridge V Walkout","Absolute Strength: Weighted Pronated Pull Up\n1 rep every 60sec x 5 sets - build through sets to 9/10\n\n- rest 90sec after last rep -\n\n1 set: AMRAP Strict Pull Up @ 20X0 \n\n*Hypertrophy/strength focus","3131; 3-5reps; rest 90sec-2min x 2 sets\n+\n21X1; 10-12reps; rest 90sec-2min x 2 sets\n\n*Volume/Mind-Muscle Connection focus","2021; 6-9reps; rest 30sec between sides; rest 75sec x 4\n\n*As you pull, lean over slightly into the lat to engage the full body of the lat, all the way down to the hop\n\n*Hypertrophy/strength focus","2021; 6-10reps/arm; rest 20sec between arms; rest 75sec x 4 sets\n\n*Volume/Mind-Muscle Connection focus","2021; 10-12reps; rest 60sec x 3 sets\n\n*Hypertrophy/strength focus","2-3 sets:\n5 Lateral Raises*\n5sec Hold at the top\n4 Lateral Raises\n4sec Hold at the top\n3 Lateral Raises\n3sec Hold at the top\n2 Lateral Raises\n2sec Hold at the top\n1 Lateral Raise\n1sec Hold at the top\n+\n40sec Plank Psoas March**\n- rest as needed -\n\n*See demo video for \"pinkies up\"\n**Go RIGHT into the plank (I want you to do this on \"dampened\" shoulders -- keep core hollow to pull knee in from the hip flexor) - pause for 1 sec per rep","3 sets:\n6 Single Leg Medball Slam RIGHT\n12 Half Kneeling Contralateral Medball Chop RIGHT\n12 Hollow Body Pull Over*\n12 Half Kneeling Contralateral Medball Chop LEFT\n6 Single Leg Medball Slam LEFT\nrest 60sec - active recovery mobility\n\n*Use medball for all 3 movements","3120; 6-8reps/leg; rest 90sec x 3-4 sets\n\n*Hypertrophy/strength focus","2021; 6-10reps; rest 90sec-2min x 4 sets\n\n*After each set of Hip Thrusts, perform 5 Single Leg Calf Raises with 5 sec squeeze at the top of each rep\n\n*Hypertrophy/strength focus","21X1; 6,8,6,8reps; rest 90sec-2min x 4 sets\n\n*Hypertrophy/strength focus\n*build to a (reasonably) tough set of 6, then strip about 5-10% of the load to sustain a RPE of 8-9 in your sets of 8","2021; 8-12reps; rest 90sec x 3 sets\n\n*Volume/Mind-Muscle Connection focus\n*keep pushing the chest forward and scaps back in that 1sec pause at the top","21X0; AMRAP-1 + Myo set; rest 2min x 4 sets\n\n*Notice change in hand position - more tricep dominant!\n*Volume/Mind-Muscle Connection focus","EMOM x 8\nodd - 40sec Goblet Cursty Step Down from Bench\neven- 40sec Weighted Hollow Rock\n\n*Emphasize the working leg on the curtsy - limit bounding as much as possible","3 sets:\n5-10 Plyo Push Ups + Push Ups*\n- rest as needed -\n10 DB ERs/side\n30sec Hollow Rocks\n- rest as needed -\n\n*For Plyo Push Ups, perform 5-10 reps where you have PEAK POWER and speed. Once you lose that, perform 5-10 Regular Push Ups @ 20X0 until about 8/10 RPE","Volume Build: Foot Banded Pull Up\n4-5 reps every 60sec x 6-8 sets*\n\n*BIGGEST volume we will see in this build. You are welcome to use straps -- pull those elbows to your back pockets!\n*Volume/Mind-Muscle Connection focus","30X1; 8,6,4,8,6,4reps; rest 75sec\n\n*Hypertrophy/strength focus\n*Wave load - aim to increase load from the first wave to the second wave","21X0; 16-20 alternating reps; rest 60sec x 5-6 sets\n\n*Volume/Mind-Muscle Connection focus\n*GROIN = HEALTHY BACK!!!! Keep those knees out as wide as you can from the abductors and then feel that big stretch in the ADDuctors (groin!)","30X1; 6-8reps/leg; rest 45sec between sides; rest 75sec x 3 sets\n\n*Hypertrophy/strength focus","4020; 6-8reps/side; rest 45sec between sides; rest 75sec x 3\n\n*Volume/Mind-Muscle Connection focus\n\n*Notice we are only doing 3 sets of this superset - that is by design. I want the MOST mind-muscle connection focus here over loading. Your hips should be warmed up and ready from cossacks!","For Quality:\n30-25-20-15-10\nKneeling Cable Crunches\n*Between sets, perform 10-15 Side Plank Rotations/side","Accumulate 2min/side -- perform long exhales during the stretch","Accumulate 2 min -- stay at about 80% stretch, add in some rocks back and forth and perform long exhales during the stretch","Follow along, pause in stretches that feel extra juicy in your body today.","Accumulate 1min/side -- focus on full rotations from the hip capsule","Accumulate 2 min -- stay at about 80% stretch, keep toes pointed toward the ceiling","Accumulate 1min/side in the stretch position\n+\nLift Offs: 20reps per leg -- hold at the top for 2sec/rep","Accumulate 2 min -- grab your shoes and pull your chest up to get extra stretch","Accumulate 1min/side -- keep back leg flexed and locked out to get hip flexor engagement","Accumulate 2 min -- stay at about 80% stretch, rock in and out, keep toes pointed toward the ceiling","Welcome to week 7/8!\nWith SWAT school next week, I want you to have training on either side of that week to preserve as much normalcy as possible in your training.\n\nAlso, because you navigated a lot of program updates in week 6. This week, we are going to use what you learned regarding your loading and RPE, and we are going to progressively overload the next few weeks.\n\nWith these new changes, use the loading guide below to ensure you are hitting the target RPE and stimulus from our training!\n\nIf You Start Too Light:\nYou\u2019re mid-set and realize the weight isn\u2019t cutting it for the RPE target? You\u2019ve got options:\n1. Stop the set and go heavier. Adjust mid-session. It happens.\n2. Treat it as your last warm-up. No harm\u2014just log it and move on.\n3. Keep going and chase the right RPE. Do as many reps as it takes to hit that effort zone, then use that info to level up next week.\nNo reps are wasted if you\u2019re learning from them.\n\nIf You Start Too Heavy:\nPushed too far, too soon? Here\u2019s how to pivot without burning out:\n1. Hit as many quality reps as you can. Don\u2019t grind\u2014just go to form failure or your RPE cap.\n2. Rest briefly. Catch your breath, reset your brace.\n3. Squeeze out 1\u20132 more reps. Only if your form stays locked in.\nThis keeps the intensity high without wrecking your set\u2014and gives you a new benchmark to work from.\n\nYou are on fire, \nCoach Bri","Welcome to week 8!\n\nYou have absolutely crushed this build.\nLet's reflect on the last 5 weeks together so far by taking 5-10mins only, and journaling the responses that immedately come to your brain.\n\n1. What would Past Me be genuinely proud of?\n2. What tiny habits or small decisions quietly compounded into real progress?\n3. What did I stay consistent with, even during chaos or transition?\n4. What did I build, create, or say yes to that Future Me will benefit from?\n\nIf you haven't taking progress photos in awhile, this is your week to do so! We want to track both metrics and goals. \n\nLet's put our head down and finish this build out strong!\n\nCoach Bri","Welcoime BACK to testing week!\n***Please compare results from Feb 2026***\n\nLet's see how your hard work OF STAYING SO CONSISTENT with your training while navigating a lot of intense work energy has paid off. I want the vibe of this week to be FUNNNN. Blast your Rainbow Kitten Surprise or whatever pumps you up in your headphones and hit it! (if you need a playlist, i got you \ud83d\udc40)\n\nLet's just stay curious about what is POSSIBLE! Keep your core braced as your main focus and only going to your SAFEST edge.\n\nNOTES FOR TESTING WEEK!\n\nPlease be cognizant of all tempo Rx's and filming angles. \nSend all training videos IN TRUECOACH in the workout so we can refer back to testing videos.\nPlease trim all videos before uploading to show only the movement being performed. \nPlease enter results into the metrics section of your workout to anticipate loading set up (see below)\n\n1. How to structure a build up to max effort:\nWarm Up Sets 1-2\nBuilding Sets 3-4\nMax Effort Attempts Sets 5-6\n*Warm up sets are light and maybe higher rep to get the blood flow\n*Building sets might be only a few reps to conserve energy (i.e., do not have to do 6 reps)\n*Max Effort Attempts are the ones you perform for 6 reps\n\n2. Recording Results and Training Intensity\nFor each movement, i want you recording:\n* the number of reps completed,\n* the weight you used\n* and RPE (rate of perceived exertion) 1-10 for EACH SET. \n\nThis helps me ensure you are progressively overloading each week and will provide you with information to refer back to back to week. You can use the \"Exercise History\" function each week to see what loads you lifted the previous week so you can either increase load or reps or improve execution (same load + reps but lower RPE).\n****Results Example:\nSet 1: 75lbs x 8 reps - RPE 6\nSet 2: 85lbs x 6 reps - RPE 7.5\nSet 3: 95lbs x 6 reps - RPE 9\n\n*RPE 9 means you could have done 1 more rep at tempo before losing form or structural integrity, RPE 8 means 2 reps left in reserve, etc.\n*All training efforts should be between 7-9 and testing efforts are between 9-10.\n\nLET'S HAVE SOME FUN THIS WEEK!!!\nYours in health,\nCoach Bri","AMRAP Hold per side; rest 45sec between sides\n\n*bottom knee is squeezed to the bench as well\n   \nL: 1:11\nR: 59\n\n2/11\nL: 1:02\nR: :55","3111; build to an 8RM. range of motion is just below the knee; rest as needed between sets and try to hit your top set in no more than 5-6 total sets\n\n*Find your SAFEST EDGE here with a belt. I want a SOLID tempo and mind-muscle connection focus here! \n   \n8@45\n8@95\n8@135/7\n8@155/8.5.  Last rep felt weird so stopped here \n\n2/11 on a straight bar \n\n8@25\n8@135/8\n8@155/9","Here is the walkthrough of your new build!\nhttps://www.tella.tv/video/new-training-cycle-overview-39tl\n\nPlease film at least ONE SET of each lift in week 0. Ideally, I want you to film your first and last set, so you can form review your own movement first before building load.\n\nPlease also keep me in the loop about training session duration and machine selection.\n\nPlease also let me know how you like the hot start adjustment.\n\nGOALS:\n1. Feel jacked for August wedding \n2. Feel strong and resilient for STOP test.\n\nLET'S TAKE OFF \ud83d\ude80\nBri","Core, Lats and Lower Traps: 2-3 sets\n20sec Tuck L Hang\n20 Supine Leg Lowers with Hip Lift \n20 Supinated Band Pull Apart\n- rest as needed between sets -\n\n*I want you squeezing out as much core engagement as you can each rep\n**Rest as needed between movements and sets to keep mind-muscle connection and movement quality the highest possible.","30X0; 4-8reps; rest 90sec x 3 sets\n\nForm: focus on lowering as far down as you can keep the lats engaged throughout that change of direction.\n\nFocus: bigger volume rep sets, less volume of sets (compared to Friday)\n\n*Set 1-2 - RPE 7/10\n*Set 3 - RPE 10/10","30X0; 6-8reps every 90sec x 4 sets","10X2; 10-12reps; rest 2min x 4 sets\n\n*Squeeze glutes HARD at the top each rep.\n*Think about bracing the 2\" below your belly button HARD and almost scooping the pelvis UP vs arching the back to get to the top.","15-20reps; rest as needed x 2-3 sets","Warmup  (8 mins) \n\n5min Cardio Your Choice \n+\n2 sets\n1) 30sec Seated Tib Raises* + 30sec Seated Calf Raises\n2) 6-8 Prone Snow Angels with Scapular Retraction\n3) McGill 3 x 8-10reps/movement\n\n*Tib Raises - you can play with performing these seated on a bench, standing against the wall, tib raises in a wall sit -- that is the order of progression, so choose the level that feels the best each day.","10mins Continuous or 2 Rounds:\n10 Runner Lunge Thoracic Rotation\n15 Cat-Cow\n20 Dynamic Adductor Stretch/side\n15 Quadruped Hip CARs/side\n10 90/90 Internal Liftoffs/side\n20 Scapular Push Up on Elbows","Athletic Rotational Core + Hips: 2-3 sets:\n10 Single Leg Medball Slam, 5/leg\n20 Medball Reverse Lunge with Twist, 10/leg\n20 Plank Medball Pass Through, 10/side\n- rest as needed between sets -\n\n**Rest as needed between movements and sets to keep mind-muscle connection and movement quality the highest possible.","3120; 8-10reps; rest 2min x 4 sets\n\n*Use lifting straps and emphasize the stretch in the glutes and hamstrings at the bottom of each rep with the 1sec pause\n\n*PRO TIP - think about pushing your feet into the ground and away from each other as if you were \"splitting the floor\" to focus on tension in the hips.","2221; 6-10reps; rest 2min x 4 sets\n\n*tempo = 2sec lower, 2 sec active hold, 2 sec to stand and 1sec at the top to re-brace core","15reps*; rest 60-90sec x 3 sets\n\nSet 1: Toes In\nSet 2: Toes Up\nSet 3: Toes Out\n\n*Or simply swap this for Suitcase Walking Lunges x 20reps, 10/leg","10-15reps/arm; rest 60-90sec x 3 sets\n\n*Biasing MOSTLY LAT here - the elbow should only travel 0-1\" past the body, not further or we will get some upper trap engagement that we don't want! \n*Use straps!","10-15reps/arm; rest 30sec between arms; rest 60-90sec x 3\n\n*At the top of each rep, actively press UP against the DB. Watch yourself in the mirror to ensure you are keeping shoulders stable and \"proud chest\" entire time.","20reps + Myo Set*; rest as needed x 2-3 sets\n\n*Perform 20reps, rest 10sec and then perform as many more as you can, but a bit quicker and more pump-focused!","Athletic Legs, Lats and Core: 2-3 sets\n10 Single Leg Pogo Hop/leg\n10 Hollow Body Pull Overs @ 2020\n20 Single Leg Vertical DB Glute Bridge/leg\n- rest as needed between sets -\n\n***Rest as needed between movements and sets to keep mind-muscle connection and movement quality the highest possible.","40X1; 3reps every 60sec x 5 sets\n+\n1 AMRAP set Wide Grip Strict Pull Ups\n\n*Small sets, high volume of sets - lower for a full 4 sec per rep\n\n*Set 1-3 - RPE 7/10\n*Set 3-5 - RPE 9/10\n*Set 6 - RPE 10/10","31X1; 8-12reps; rest 90sec-2min x 4 sets\n*Add in 5 box jumps after each set\n\n*Keep core braced and pushed into the bench","3121; 10,8,6,10reps/leg; rest 45sec between sides; rest 2min\n\n*Wave load - aim to increase load on second set to the first","3120; 8-10reps every 75sec x 8 sets (4/leg)\n\n*Focus mainly on keeping the lower core braced so hips stay fixed and level, only lower as far as you can keep that core braced hard. \n*Hypertrophy/Mind-Muscle Connection Focus","2-3 sets:\n20m Dual KB Rack Carry - heavier than you think!\n- rest 15sec - \n1-1/4 Hands Elevated Push Up x AMRAP -2\n- rest 15sec -\n20 Alt V-Ups\n- rest as needed -\n\n*Your only thought this WHOLE CIRCUIT should be, \"is the 2\" below my belly button braced? am i bracing my whole core as if someone was going to come punch me in the stomach?\"","This is my favorite aerobic flow right now.\n\nI love being able to just get into my music and my body, greasing the hinges of anything and everything that feels tight. This is also a session that you can use on any day you feel a little mentally tapped from training or LIFE.\nThe program is written so you can do this on any day and will make your next lift feel SO STRONG!\n\nGoal of this session: Pop those airpods in and just get in touch with your body. If you prefer, you can simply perform these mobility movements after a walk during the week and omit the 45sec aero work.\n\n12sets:\n45sec Ski/Row/Bike/Run @ Zone 2-3\n45sec Active Mobility*\n\n*Peform 45sec of each movement - in the specified order or the order of your choosing!\n1. Hip Airplates LEFT\n2. Hip Airplanes RIGHT\n3. Dynamic Frog Stretch or 90/90 Hip Rolls\n4. Half Kneeling KB Windmill LEFT\n5. Half Kneeling KB Windmill RIGHT\n6. Prone Snow Angels with Scapular Retraction\n- then repeat or add your own favorite mobility moves -","Welcome to your official Week 1!\n \nThis week, and the weeks to come:\nReps and sets stay the same \u2014 the intensity and intent is what changes.\n \nGOAL stays the same - only loading as heavy as you can maintain mind-muscle connection and empasis on the quality of tempo and positions.\n \nThis week, your target RPE is 8\u20139/10 (up from 7). That means your working weight should challenge you about one rep before failure.\n \nHow to dial it in:\n- Take 1\u20132 warm-up sets to build to your working weight.\n- On your first working set, push close to failure to test the load.\n- If you could\u2019ve done 1\u20132 more reps, you nailed it \u2014 keep that weight for the remaining sets.\n- If you had 3+ reps left, bump the weight up and treat the next set as your true first working set.\n \n \nQuick adjustments (no overthinking):\n \nToo light?\nTreat it as a warm-up or push the set until you hit the right RPE, then adjust the weight for the next set. Nothing is wasted if you\u2019re learning.\n \nToo heavy?\nGet as many clean reps as you can without grinding, rest briefly, then add 1\u20132 more quality reps if form stays locked in.\n \nTrain with intention this week. Use the first set to collect data, then execute. \n \nProud of you!\nCoach Bri","\ud83c\udfafTarget: Your bodyweight x .8-1.25 per day\n\nHow did your protein target go this week? How many days were you close to your target? Any obstacles you noticed? Did you take your time chewing each bite until smoothie-like consistency?","\ud83c\udfafTarget: 7-8 hours on average for the week\n\nHow did you feel this week with your evening routines? Is there anything you will change for next week? How many hours did you sleep? Did you wake up rested? Did you go to bed with you rmind spinning?","\ud83c\udfafTarget: \"Your brain is for creating thoughts -- not storing them.\" Let those ideas take up space! (on a page, not in your brain!)\n\nOne of the most effective ways to stay out of and avoid burnout is journaling -- it doesn't have to be pen to paper, either. I have played with recording voice memos and saving them. I have also made a \"project\" in Claude for my daily reflections. This really helps me organize my ideas for my different projects and also to clear out any negative energy that is stored in my cells and thoughts before I truly wind down from the day. Usually when I do this, items for my to-do list pop into my brain, and instead of storing them in my brain, I write them down for the next day. \n\n*This also helps manage burnout and overwhelm.","\ud83c\udfafTarget: an average of 10k steps per day\n\nHow active were you during the day last week? Did you notice any obstacles? Any areas of opportunity going into next week? \n\nMaybe sneaking in a 10-15min post-meal walk just to help regulate blood sugar and bloating?\n\nMaybe adding in a short 10-15min cool down walk after training?\n\nMaybe scheduling a long distance friend \"walk and talk\" check in?","\ud83c\udfafTarget: Aim for your bodyweight x 1/2-2/3","Please reflect on how the Core 4 Lifestyle priorities went over the last week and identify areas of opportunity to bring into next week!\n\nPlease use the questions to guide your reflection on the last week - no need to answer each question individually.\n\nWeek over week, we can see how these foundational 4 focuses improve and evolve over time.","40X1; 3reps every 60sec x 5 sets\n+\n1 AMRAP set Strict Pull Ups\n\n*Small sets, high volume of sets - lower for a full 4 sec per rep\n\n*Set 1-3 - RPE 7/10\n*Set 3-5 - RPE 9/10\n*Set 6 - RPE 10/10","31X1; 8-12reps; rest 90sec-2min x 4 sets\n*Add in 5 box jumps after each set\n\n*Keep core braced and pushed into the bench\n*Treat this more like VOLUME focus","Welcome to week 2 of your new build!\n \nThis week, we\u2019re keeping reps the same, but we continue to up the ante. Your goal is to explore progressive overload through smarter, more intentional movement. Think MMC (mind-muscle connection), TUT (time under tension), ROM (range of motion), and RPE (rate of perceived exertion).\n \nPrioritizing the quality of your movement (how well you execute each rep) is a powerful form of auto-regulation. It keeps you tuned in to your body, protects you from burnout, and helps you build strength that lasts.\n \nYour goal the next few weeks is to progressively overload.\n \nYou have the option to manipulate the:\n\ud83c\udfafTEMPO (adding more squeeze in each rep or slowing the eccentric to load the tissues more),\n\ud83c\udfafREPS (if you were at the lower end last week, do more reps at that weight this week) or\n\ud83c\udfafLOAD (conversely, if you were on the higher end, see if you can bump up load!).\n\ud83c\udfafSETS (if you noticed your first working set was not an optimal effort, consider that first set a warm up and do another set at the target RPE for the day).\n \n \nLet's get STRONG,\nCoach Bri","40X1; 3reps every 60sec x 5 sets\n+\n1 AMRAP set Supinated Grip Pull Ups\n\n*Small sets, high volume of sets - lower for a full 4 sec per rep\n\n*Set 1-3 - RPE 7/10\n*Set 3-5 - RPE 9/10\n*Set 6 - RPE 10/10","31X1; 8-12reps; rest 90sec-2min x 4 sets\n*Add in 5 box jumps after each set\n\n*Keep core braced and pushed into the bench\n*Make sure you are focusing on absorbing the force of the box jump more than the height of the box","3121; 10,8,6,10reps/leg; rest 45sec btwn sides; rest 2min\n\n*Wave load - aim to increase load on second set to the first\n*be patient on the 1sec hold at the top by squeezing as MUCH AS YOU CAN in that one sec","How did you feel this week with your evening routines? Is there anything you will change for next week? How many hours did you sleep? Did you wake up rested?","One of the most effective ways to stay out of and avoid burnout is journaling -- it doesn't have to be pen to paper, either. I have played with recording voice memos and saving them. I have also made a \"project\" in Claude for my daily reflections. This really helps me organize my ideas for my different projects and also to clear out any negative energy that is stored in my cells and thoughts before I truly wind down from the day. Usually when I do this, items for my to-do list pop into my brain, and instead of storing them in my brain, I write them down for the next day. This also helps manage burnout and overwhelm. \"Your brain is for creating thoughts -- not storing them.\" Let those ideas take up space! (on a page, not in your brain!)","Welcome to week 3 \ud83d\udd25\n \nThis is the last time you will see these reps before we drop the reps and increase load next week.\n \nThis week is about finding your loading edge with the best mind\u2013muscle connection and positions you can own, especially on the last set of each movement.\n \nYou have navigated some BIG life changes over the last month. Let's reflect on your mindset over the last 3 weeks to honor the effort you have put in thus far, and set yourself up for success in the weeks to come.\n***Please take just 5mins to reflect on these 3 questions and send me a message with your responses!\n \n1. What characteristics of my current mindset or routines would Past Me be genuinely proud of?\n \n2. What tiny habits or small decisions have I made over the last few weeks that I am proud of?\n \n3. What did I stay consistent with, even during the chaos/transition?\n \n \nLet's keep this train rollin'!\nCoach Bri","40X1; 3reps every 60sec x 5 sets\n+\n1 AMRAP set Wide Grip Pull Ups (compare to week 0)\n\n*Small sets, high volume of sets - lower for a full 4 sec per rep\n\n*Set 1-3 - RPE 7/10\n*Set 3-5 - RPE 9/10\n*Set 6 - RPE 10/10","31X1; 8-12reps; rest 90sec-2min x 4 sets\n\n*5 box jumps after each set\n\n*Keep core braced and pushed into the bench","Welcome to week 4 \u2764\ufe0f\u200d\ud83d\udd25\n \nThis week, I have added some tempo RXs to your absolute strength work (6-10reps), and I have decreased the reps on your hypertrophy lifts. You will notice the tempo Rx has a number in the concentric. You'll also notice no pause at the top or bottom. The goal of this type of tempo Rx is to maintain tension on the muscles the entire lift. Each set should put you in the 30-40sec Hypertrophy zone.\n \nWe know that hypertrophy determines the contour of your body, but walking and managing energy balance (cals in and cals out), is what achieves true Body Recomposition. Let's make sure we are using walking for mental health JUST as much as physical health.\n \nTLDR: your big goals this week are to match your RPE from last week with the added tempo and rep change stimulus, ensure you are hitting your protein (aim for 40g per meal) + 5g creatine every day, and getting your steps in.\n \nCoach Bri","Core, Lats and Lower Traps: 2-3 sets\n20sec Hanging Oblique Raise\n20 Supine Leg Lowers with Hip Lift \n20 Supinated Band Pull Apart\n- rest as needed between sets -\n\n*I want you squeezing out as much core engagement as you can each rep\n**Rest as needed between movements and sets to keep mind-muscle connection and movement quality the highest possible.","20X0; 6 tough reps every 60sec x 5 sets\n\nForm: focus on lowering as far down as you can keep the lats engaged throughout that change of direction.\n\nFocus: bigger volume rep sets, less volume of sets (compared to Friday)\n\n*Set 1-3 - RPE 7-8/10\n*Set 4-6 - RPE 9-10/10","30X0; 8,6,6,4reps every 90sec x 4 sets","10X2; 8-12reps; rest 2min x 4 sets\n+\nMyo set on last set**\n\n*Squeeze glutes HARD at the top each rep.\n*Think about bracing the 2\" below your belly button HARD and almost scooping the pelvis UP vs arching the back to get to the top.\n**rest 20sec after last successful rep of the 8-12, then perform as many more reps as you can until absolute failure - no tempo, just rep it out and chase the pump!","10,12,15reps/leg; rest 30sec between sides; rest 60-90sec x 3 sets\n\n*Squeeze hamstrings for one sec each rep \n*Push yourself into the seat HARD using the handles \n**Start with a TOUGH set of 10 then strip weight each set to match RPE","10.10.10reps; rest as needed x 2 sets\n\n*rest 10sec between sets of 10 for 30reps per set","Athletic Rotational Core + Hips: 2-3 sets:\n10 Rotational Medball Slam, 5/side\n20 Medball Goblet Low Cossack Switch, 10/leg\n20 Medball Overhead Sit Up\n- rest as needed between sets -\n\n**Rest as needed between movements and sets to keep mind-muscle connection and movement quality the highest possible.","2020; 8-10reps; rest 2min x 4 sets\n\n*No pause in the bottom -- keep tension on hamstrings whole time - do not stand up all the way so you can feel that tension\n*PRO TIP - think about pushing your feet into the ground and away from each other as if you were \"splitting the floor\" to focus on tension in the hips.","2120; 6-10reps; rest 2min x 4 sets","10,12,15reps*; rest 60-90sec x 3 sets\n\nstart by building to a tough set of 10 then strip a little weight for the next two sets to match RPE","2021; 8-12reps/arm; rest 60-90sec x 3 sets\n\n*Keep tension on lats in the 2sec eccentric\n*Use straps!","8-12reps/arm; rest 30sec between arms; rest 60-90sec x 3\n\n*At the top of each rep, actively press UP against the DB. Watch yourself in the mirror to ensure you are keeping shoulders stable and \"proud chest\" entire time.","20reps + Myo Set*; rest as needed x 2-3 sets\n\n*Focus on reaching OUT with the arms versus up\n*Perform 20reps, rest 10sec and then perform as many more as you can, but a bit quicker and more pump-focused!","Athletic Legs, Lats and Core: 2-3 sets\n10 Single Leg Lateral Pogo Hop to Plate/leg, 2\"\n15 Weight Plate Pull Overs, 10-25lbs\n20 Single Leg Vertical DB Glute Bridge/leg (foot on 2\" plate)\n- rest as needed between sets -\n\n*Use the same plate or two different plates based on height/load of the plate\n***Rest as needed between movements and sets to keep mind-muscle connection and movement quality the highest possible.","40X1; 1.1reps every 60sec x 5 sets (rest 10sec between singles)\n+\n1 AMRAP Strict Pull Ups (compare to week 1)\n\n*Small sets, high volume of sets - lower for a full 4 sec per rep\n\n*Set 1-3 - RPE 7/10\n*Set 3-5 - RPE 9/10\n*Set 6 - RPE 10/10","31X1; 6-10reps; rest 90sec-2min x 4 sets\n*Add in 5 Burpee Box Jumps after each set**\n\n*Keep core braced and pushed into the bench\n**I want focus on hip explosiveness over the height -- so, start with a 7/10 RPE on the box jump and stack plates on top of the box to customize your height if there are not stackable boxes.","3121; 8,8,6,6,4reps/leg; ret 45sec between sides; rest 2min","3010; 8-10reps every 75sec x 8 sets (4/leg)\n\n*No pause in the bottom, so focus on re-bracing the core going into the bottom/change in direction so your CORE determines how low you are able to stretch the hip flexor without hips shifting","2-3 sets:\nDynamic Bench Push Up x AMRAP -2*\n- NO REST -\nBench Push Up @ 20X0 x AMRAP\n- rest 15sec -\n20m Mixed Rack Overhead Carry/side; offset loading encouraged\n- rest 15sec - \n10 Pike Leg Lift Overs\n- rest as needed -\n\n*Call the set once you lose the explosiveness, about 2 reps before true failure. Then, no rest, go right into an AMRAP set of bench push ups. Ensure your tailbone is tucked and core + pelvic floor is braced HARD the whole time, especially in the regular bench push ups when you are fatigued.","Welcome to week 5!\n \nYou navigated a lot of program updates last week. This week, we are going to use what you learned regarding your loading and RPE, and we are going to progressively overload the next few weeks.\n \nWith these new changes, use the loading guide below to ensure you are hitting the target RPE and stimulus from our training!\n \nIf You Start Too Light:\nYou\u2019re mid-set and realize the weight isn\u2019t cutting it for the RPE target? You\u2019ve got options:\n1. Stop the set and go heavier. Adjust mid-session. It happens.\n2. Treat it as your last warm-up. No harm\u2014just log it and move on.\n3. Keep going and chase the right RPE. Do as many reps as it takes to hit that effort zone, then use that info to level up next week.\nNo reps are wasted if you\u2019re learning from them.\n \nIf You Start Too Heavy:\nPushed too far, too soon? Here\u2019s how to pivot without burning out:\n1. Hit as many quality reps as you can. Don\u2019t grind\u2014just go to form failure or your RPE cap.\n2. Rest briefly. Catch your breath, reset your brace.\n3. Squeeze out 1\u20132 more reps. Only if your form stays locked in.\nThis keeps the intensity high without wrecking your set\u2014and gives you a new benchmark to work from.\n \n \nYou are on fire,\nCoach Bri","40X1; 1.1reps every 60sec x 5 sets (rest 10sec between singles)\n+\n1 AMRAP set Wide Grip Pull Ups (Compare to week 0 and 3)\n\n*Small sets, high volume of sets - lower for a full 4 sec per rep\n\n*Set 1-3 - RPE 7/10\n*Set 3-5 - RPE 9/10\n*Set 6 - RPE 10/10","31X1; 6-10reps; rest 90sec-2min x 4 sets\n*Add in 5 Burpee Box Jumps after each set\n\n*Keep core braced and pushed into the bench\n* I want focus on hip explosiveness over the height -- so, start with a 7/10 RPE on the box jump and stack plates on top of the box to customize your height if there are not stackable boxes.","3121; 8,8,6,6,4reps/leg; rest 60sec between sides; rest 2min","Welcome to week 0!\nThis is the REAL THING!\nBased on our last few conversations, we discussed adding in some conditioning AND also making sure your steps are top priority. Truly the mroe active you can be throughout the day, the less you sit, the more your body is MOVING the better your metaboilsm will respond. I have some really good science behind these finishers - ie: stairmaster after training helps increase the volume of muscle breakdown when you finish an upper body day (because no lower was broken down yet.) WIth that said, I am open to adding in some more \"arms work\" on yoru lower body days if legs are feeilng smoked, even with the 10k step challenge.\n\nThis week, strength training is:\nRPE Target 8-8.5/10\n \nPlease let me know how these sessions feel at first glance, and after you have given them a go!\n\nI am determined to find our new flow!\nBri","1 set:\n20 Dynamic Adductor Stretch/side\n20 Cat-Cow\n+\n2-3 Rounds Continuous:\n12 Half Kneeling KB Windmill LEFT\n20sec Copenhagen Raise LEFT\n24 KB Russian Twists\n12 Half Kneeling KB Windmill RIGHT\n20sec Copenhagen Raise RIGHT\n24 KB Russian Twists\n- rest as needed -","3022; 6-10reps/leg; rest 30sec btwn sides;; rest 2min x 3 working sets\n\n*keep pelvis tucked under and brace the lower core!!","2120; 6-8reps; rest 2min x 3 working sets","2021; 12-15reps; rest 75sec x 3 sets\n\n*push yourself into the seat HARD so you can isolate the hammies and feel that streeetttchhh as you release the heels away from under your butt!\n\n*You are welcome to superset the ham curl and lateral drag IF you are able to! Just keep rest periods the same.","20steps/direction (accumulated ok)(; rest 75sec x 3 sets\n\n*Please use the straps to hold as you cross step, or put the straps around the sled so you can have the bent/straps around your waist so you can isolate the hips and hamstrings,","*choose spin bike, assault bike, even a recumbent bike works.\n\n4-6 sets @ Sustained Effort Per Set*\n3000m Bike\n90sec Rest or Easy Spin\n\n\u2b50How to pace it:\nPick a pace you're confident you can hold for the entire 3000m, then repeat for every set. The goal is consistency \u2014 your set times shouldn't vary by more than 10 seconds from fastest to slowest. Record each interval so you can track it.\n\n\u2b50 How hard should it feel?\nFaster than conversational pace. You should be able to get out 2\u20133 words at a time, but not full sentences \u2014 think broken, clipped speech, not a chat.","Cooldown\n1 set:\nElevated Pigeon x 60 sec/side\nCouch Stretch x 60 sec/side\nFrog Stretch x 60sec\n5min Static back*\n\n*Perform 5 minutes of static back. Try to inhale through the nose for 3 seconds and exhale through the mouth for 6 seconds. Try to slow the breathing post workout in order to switch from a sympathetic to a parasympathetic state before resuming your day to day. This will help with better nutrient absorption, energy regulation and overall mindset.","1 set:\n15-20 Banded Cuban Presses\n+\n2-3 sets:\n12set Assault Bike SPRINT\nAMRAP Deficit Push Ups* @ 31X0\n10 Half Kneeling Windmills/side - deliberate\n- rest 60sec -\n\n*hands on 45lb plates\n*Record peak wattage on each bike sprint","31X1; 4-6reps; rest 2min x 4 sets\n+\n85% of weight in last set for an AMRAP-1 @ 30X0 tempo\n*take a video from the direct side please","21X1; 6-10reps/arm; rest 45sec between sides; rest 90sec x 4 sets\n+\nMyo set/arm on last set","30X0; 6-10reps/arm; rest 45sec between arms; rest 90sec x 3 sets\n+\nMyo set/arm on last set","4mins Stairmaster @ Easy Pace (HR below 140)\n1min of Continuous Movement*\nx 3-5 Rounds (15-20min total)\n\nContinuous Movement:\nAMRAP Push Ups @ 20X0 + AMRAP V-Ups in the remaining time*\n\n*In the alternating intervals, you will perform the \n'Continuous Movement' segment that I will switch up every so often, giving you a chance to progressively overload these movements (hellooo shoulders and abs). If you perform 10 push ups, it may take you 30sec, so the remainder 30 sec you will perform V Ups until it's time to go on the stairmaster again.","Heel Sit x 1 min\nQuadruped Hip CARs x 5/side/direction\nReclining Hero Pose x 1-2 min\nWorlds Greatest Stretch x 1 min/side\nFront Split Progression x 1 min/side\nBottom of Squat Hold x 1 min \nAssisted Cossack Squat x 10/side\n\n*Perform this ONCE. If you have a little extra time/oomph, repeat 1-2 of the movements that feel the tightest for you today.","1 set:\n20 Dynamic Adductor Stretch/side\n20 Cat-Cow\n+\n2-3 sets:\n12 Medball Slams - HARD\n12 Medball Bearhug Patrick Step L3/leg*\n12 Hanging Knee Raise (grip hard!)\n- rest 60sec -\n\n*Stand on 45lb plate or two - film one set from side","21X1; 6-10reps/leg; rest 45sec between sides; rest 60sec x 4 sets","10/leg with 3sec hold at top/rep; rest as needed x 3-4 sets\n\n*4th set is optional here - assist with balance by holding onto squat rack lightly","3111; 8-12reps; rest 90sec x 4 sets\n\n*Stop the bar mid-shin  for 1sec per rep but holding an ACTIVE scapular position in that pause","20,20,20reps; rest 90sec\n\n*VOLUME and muscle endurance here!!","10-15min Continuous For Quality\n20sec Dual KB Rack Wall Sit\n40sec Dual KB Rack Carry\n6 KB Rack Reverse Lunges LEFT\n3 Half Kneeling KB Windmill LEFT\n30sec Bent Hollow Hold\n6 KB Rack Reverse Lunges RIGHT\n3 Half Kneeling KB Windmill RIGHT\n\n*Walk through the flow of movements in your head before starting. You will need a heavier set of KBs for the wall sit and carry (think 35-44lbs) and then","2-3 sets:\n12set Assault Bike SPRINT\nAMRAP-2 Offset Medball Push Up\n12 Prone Snow Angels (lift as high as you can)\n- rest 60sec -\n\n*Record peak wattage on each bike sprint","31X1; 4-6reps; rest 2min x 4 sets\n\n*GO heavy on this with low reps","20X0; 8-10reps; rest 90sec x 4 sets\n\n*VOLUME AND MUSCLE ENDURANCE","31X1; 2reps every 60sec x 7 sets\n+\n1 set: AMRAP Strict Pull Up (no tempo, burnout)\n\n*start around 40lbs","20X2; 10 HARD reps every 90sec x 3 sets\n\n*Focus on the rear delt activation here by pulling the rope apart","4mins @ 50% Pace (HR below 130)\n4mins @ 85% Easy Pace (HR 130-150)\nx 3-4 Rounds (16-24min)","2 sets:\nShoulder External Rotation Lift Off x 10\nShoulder Internal Rotation Lift Off x 10\nTall Kneeling Tricep Stretch x 30sec\nWeighted Prone Scapular Retractions x 10\nProne Snow Angels x 10\nQuadruped Thoracic Rotations x 10/side\n\n*rest as needed between movements and sets to keep quality high\n*Pause 1-2 seconds at the TOP/stretch position each rep.","Welcome to your official Week 1!\n \nThis week, and the weeks to come:\nReps and sets stay the same \u2014 the intensity is what changes.\n \nGOAL stays the same - only loading as heavy as you can maintain mind-muscle connection and empasis on the quality of tempo and positions.\n \nThis week, your target RPE is 8\u20139/10 (up from 7). That means your working weight should challenge you about one rep before failure.\n\n\u2b50 If you were on the higher end of the reps last week, aim to increase load.\n\u2b50 If you were on the lower end of the reps last week, see if you can increase your reps and/or your mind-muscle connection to those reps.\n\nLET'S GET IT!\nBri","OPTIONAL\nTabata - 20sec max reps/10sec rest x 8 sets (4min)\n\n*do not stop - drop weight if needed","21X1; 6-10reps/leg; rest 45sec between sides; rest 60sec x 4 sets\n\n*front foot on two 45lb plates","10/leg with 3sec hold at top/rep; rest as needed x 3-4 sets\n\n*4th set is optional here - assist with balance by holding onto squat rack lightly\n*stand on the same two 45lb plates, so you have constant tension on the hip flexor","Welcome to week 2!!\nThis week is all about progressing from last week. You made some significant jumps from week 0 to week 1, so let's see what you can do this week!\n\nYou are NOT allowed to train unless you have completed your log from the night before. (i know you like guardrails, so let's add this one!)","20steps/direction (accumulated ok); rest 75sec x 3 sets\n*Hold a 45sec Front Leaning Rest Plank (shoulders over fingertips slightly)\n\n*Please use the straps to hold as you cross step, or put the straps around the sled so you can have the bent/straps around your waist so you can isolate the hips and hamstrings,","Welcome to week 4!\nThis is an odd week because I am going to move you over to Trainerize, aka my new Built By Bri app! \n\nThis week, I want you to aim for the lowest end of the reps and push the effort a bit. Next week, we are going to transition into the new app!"],"S":[["2025-03-24","Week 0 - Push",1,6,7,[["A","NOTE TO MICHAELA",0,"",""],["B","Crossbody Lateral Raise",1,"crossbody lateral raise","15@10\n10@10\n15@10"],["C","Hammer Strength Flat Bench",2,"hammer strength flat bench","No hammer strength bench at the y \n\n10@50\n10@100\n6@120\n\n6@140\n6@150/9"],["D","Back Supported Dumbbell Shoulder Press",2,"back supported dumbbell shoulder press","10@30/9\n7@35\u2026 got a bit ahead of myself"],["E","Weighted Dip",2,"weigh
